<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="TT Robotics öğretmen ve yönetici paneli (önizleme sürümü).">
<title>TT Robotics Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: TT Robotics site language — navy sidebar with the wing logo, ice-blue page ground, large-radius white cards, Bricolage Grotesque display + Karla body, #0067FF action blue. */
:root{
  --navy:#0E2156; --navy-2:#1E3A8A; --blue:#0067FF; --blue-2:#1863DC; --ice:#E7F6FF;
  --bg:#EDF5FC; --surface:#FFFFFF; --surface-2:#F1F7FD; --line:#D9E6F2; --fg:#0F172A; --muted:#5B6B82;
  --accent:#0067FF; --accent-fg:#FFFFFF; --accent-soft:#E2EEFF;
  --side-bg:#0E2156; --side-fg:#C7D6F2; --side-on:#FFFFFF; --side-on-bg:rgba(255,255,255,.12); --side-line:rgba(255,255,255,.10);
  --ok:#15803D; --ok-soft:#DCFCE7; --warn:#A16207; --warn-soft:#FEF3C7; --bad:#B91C1C; --bad-soft:#FEE2E2; --info:#1E3A8A; --info-soft:#E7F6FF;
  --display:'Bricolage Grotesque','Karla',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font:'Karla',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px; --shadow:0 1px 2px rgba(14,33,86,.05),0 14px 36px -18px rgba(14,33,86,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --surface:#121B2E; --surface-2:#182540; --line:#263654; --fg:#E8EEF8; --muted:#9AAAC4;
    --accent:#5B9BFF; --accent-fg:#071020; --accent-soft:#1A2D52; --ice:#13213C;
    --side-bg:#0A1430; --side-fg:#AFC0E0; --side-on:#FFFFFF; --side-on-bg:rgba(255,255,255,.12); --side-line:rgba(255,255,255,.08);
    --ok:#4ADE80; --ok-soft:#113022; --warn:#FACC15; --warn-soft:#3A2E0B; --bad:#F87171; --bad-soft:#3B1515; --info:#9DB8F5; --info-soft:#172544;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 36px -18px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121B2E; --surface-2:#182540; --line:#263654; --fg:#E8EEF8; --muted:#9AAAC4;
  --accent:#5B9BFF; --accent-fg:#071020; --accent-soft:#1A2D52; --ice:#13213C;
  --side-bg:#0A1430; --side-fg:#AFC0E0; --side-on:#FFFFFF; --side-on-bg:rgba(255,255,255,.12); --side-line:rgba(255,255,255,.08);
  --ok:#4ADE80; --ok-soft:#113022; --warn:#FACC15; --warn-soft:#3A2E0B; --bad:#F87171; --bad-soft:#3B1515; --info:#9DB8F5; --info-soft:#172544;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 36px -18px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2;font-family:var(--display);letter-spacing:-.01em}
h1{font-size:28px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.boot,.nodb{min-height:60vh;display:grid;place-items:center;padding:24px 16px;text-align:center;color:var(--muted)}
.nodb .card{max-width:460px;text-align:left}
/* app frame */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;padding:22px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.side .logo{display:block;width:150px;margin:6px auto 8px;height:auto;filter:drop-shadow(0 0 14px rgba(0,103,255,.45))}
.side .role{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-fg);opacity:.8;margin-bottom:22px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--side-fg);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.side nav a:hover{background:var(--side-line);color:var(--side-on)}
.side nav a.on{background:var(--side-on-bg);color:var(--side-on)}
.side nav a .ic{width:18px;height:18px;flex:none;opacity:.85}
.side .user{margin-top:auto;padding-top:16px;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:8px}
.side .user .name{color:var(--side-on);font-weight:600;font-family:var(--display);font-size:15px;overflow:hidden;text-overflow:ellipsis}
.side .user .btn{background:transparent;border-color:var(--side-line);color:var(--side-on)}
.side .user .btn:hover{background:var(--side-line)}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
main{padding-block:28px 56px;padding-inline:32px;min-width:0;display:flex;flex-direction:column;gap:26px;max-width:1280px;width:100%}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:12px 16px;flex-direction:row;align-items:center;gap:12px;overflow:visible}
  .side .logo{width:84px;margin:0;filter:drop-shadow(0 0 8px rgba(0,103,255,.4))}
  .side .role{display:none}
  .side nav{display:none}
  .side .user{margin:0 0 0 auto;padding:0;border:0;flex-direction:row;align-items:center}
  .side .user .name{display:none}
  .topbar{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;scrollbar-width:none}
  .topbar a{white-space:nowrap;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--fg);font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface)}
  .topbar a.on{background:var(--navy);border-color:var(--navy);color:#fff}
  main{padding-inline:16px;padding-block:18px 40px;gap:20px}
  h1{font-size:24px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{padding:12px 14px}
  .tile b{font-size:26px}
  .hero{padding:18px 18px}
  .hero h1{font-size:26px}
}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead .sub{margin-top:4px}
.sub{color:var(--muted)}
section{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbl.avail td:first-child{min-width:220px;max-width:320px}
.tbl.avail td:not(:first-child){white-space:nowrap;width:1%}
.tbl.avail td:not(:first-child) .chip{white-space:normal;max-width:160px;text-align:left}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.tile b{font-size:32px;font-weight:600;font-family:var(--display);font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.02em;color:var(--navy-2)}
:root[data-theme="dark"] .tile b{color:var(--fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile b{color:var(--fg)}}
.tile span{color:var(--muted);font-size:13px}
.tile.warn{border-color:var(--warn);background:var(--warn-soft)}
.tile.warn span{color:var(--fg)}
.tile.warn b{color:var(--warn)}
/* cards & tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card.tight{padding:0;overflow:hidden}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;background:var(--surface-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl tr.total td{font-weight:700;background:var(--surface-2)}
.tbl .today td{background:var(--accent-soft)}
.tbl th.today{color:var(--accent)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;line-height:1.2;text-decoration:none;font-size:13.5px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:0 6px 16px -8px rgba(0,103,255,.6)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.side nav a:focus-visible,.topbar a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toolbar .grow{flex:1 1 auto}
.toolbar select,.toolbar input{width:auto}
.nav-month{display:inline-flex;align-items:center;gap:4px}
.nav-month b{min-width:130px;text-align:center;font-weight:600;font-family:var(--display)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
/* lesson rows */
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;border-left-width:5px;box-shadow:var(--shadow)}
.lrow.done{border-left-color:var(--ok)}
.lrow.pending{border-left-color:var(--warn)}
.lrow.cancelled{border-left-color:var(--bad)}
.lrow.upcoming{border-left-color:var(--line)}
.lrow .l-when{font-family:var(--mono);font-size:12.5px;color:var(--muted);line-height:1.3;min-width:0}
.lrow .l-when:empty{display:none}
.lrow .l-main b{font-weight:700;font-family:var(--display);font-size:15px}
.lrow .l-hrs{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:64px}
.lrow .l-st{white-space:nowrap}
.lrow .l-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:720px){
  .lrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"when st" "main main" "hrs act"}
  .lrow .l-when{grid-area:when}.lrow .l-st{grid-area:st}.lrow .l-main{grid-area:main}.lrow .l-hrs{grid-area:hrs}.lrow .l-act{grid-area:act}
}
.daygroup{display:flex;flex-direction:column;gap:6px}
.daygroup h3{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:8px;font-family:var(--font);font-weight:700}
.daygroup h3.today{color:var(--accent)}
.empty{color:var(--muted);padding:18px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center;background:var(--surface)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-radius:var(--r-sm);background:var(--info-soft);color:var(--info);border:1px solid transparent}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.note{padding:12px 14px;border-radius:var(--r-sm);background:var(--ice);color:var(--muted);font-size:12.5px;line-height:1.55}
/* hero (overview) */
.hero{background:var(--navy);color:#fff;border-radius:var(--r);padding:22px 24px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(0,103,255,.55),rgba(0,103,255,0) 70%);pointer-events:none}
.hero .wm{position:absolute;right:-10px;top:50%;transform:translateY(-50%) rotate(-8deg);width:190px;height:auto;opacity:.09;pointer-events:none}
.hero>div{position:relative;z-index:1}
.hero .toolbar{justify-content:flex-end}
@media (max-width:900px){.hero .wm{width:90px;right:14px;top:14px;transform:none}}
.hero h1{color:#fff;font-size:30px}
.hero .sub{color:#C7D6F2}
.hero .eyebrow{color:#8FB4FF}
.hero .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;position:relative}
.hero .btn.primary{background:var(--blue);border-color:var(--blue)}
/* week grid */
.wk td{min-width:150px;vertical-align:top}
.wk td:first-child{min-width:150px;font-weight:700;font-family:var(--display)}
.cell-l{display:block;padding:6px 9px;border-radius:8px;margin:2px 0;background:var(--surface-2);border-left:3px solid var(--line);font-size:12.5px;line-height:1.3}
.cell-l.done{border-left-color:var(--ok)}.cell-l.pending{border-left-color:var(--warn)}.cell-l.cancelled{border-left-color:var(--bad);text-decoration:line-through;opacity:.8}
.cell-l b{display:block;font-weight:700}
.cell-l .mono{color:var(--muted);font-size:11.5px}
/* forms */
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.fld small{color:var(--muted);font-size:11.5px}
.fld.row{flex-direction:row;align-items:center;gap:8px}
input:not([type=checkbox]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.ferr{color:var(--bad);font-size:12.5px;min-height:1em}
/* login */
.login-wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.login-side{background:var(--navy);color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative;overflow:hidden}
.login-side::before{content:"";position:absolute;left:-120px;bottom:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(0,103,255,.6),rgba(0,103,255,0) 70%)}
.login-side .logo{width:min(260px,70%);height:auto;position:relative;filter:drop-shadow(0 0 28px rgba(0,103,255,.55))}
.login-side h1{color:#fff;font-size:34px;line-height:1.15;position:relative;max-width:22ch}
.login-side p{color:#C7D6F2;position:relative;max-width:46ch}
.login-side .pts{display:flex;flex-direction:column;gap:10px;position:relative}
.login-side .pts div{display:flex;gap:10px;align-items:flex-start;color:#E3ECFF;font-size:14px}
.login-side .pts span{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:7px;flex:none}
.login-side .foot{font-size:12px;color:#8FA3CC;position:relative}
.login{padding:48px 40px;display:flex;flex-direction:column;gap:18px;justify-content:center;max-width:560px;width:100%;margin:0 auto}
.login .card{gap:14px}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 6px}
.login-brand img{width:min(300px,80%);height:auto}
.login-cards{display:flex;flex-direction:column;gap:16px}
.card-head{display:flex;align-items:center;gap:14px}
.card-ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.card-ic .ic{width:22px;height:22px}
.plink{color:inherit;text-decoration:none;font-weight:700;border-bottom:1.5px solid var(--accent-soft)}
.plink:hover{color:var(--accent);border-bottom-color:var(--accent)}
.tbl td .plink{font-family:var(--display);font-size:14.5px}
@media (max-width:900px){
  .login-wrap{grid-template-columns:minmax(0,1fr)}
  .login-side{padding:28px 20px;gap:22px}
  .login-side h1{font-size:26px}
  .login-side .logo{width:150px}
  .login-side .pts{display:none}
  .login{padding:22px 16px 40px}
  .login-brand{display:none}
}
/* modal */
#modal-root{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.backdrop{position:absolute;inset:0;background:rgba(8,20,48,.55);backdrop-filter:blur(2px)}
.modal{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal.wide{width:min(760px,100%)}
.modal form{display:flex;flex-direction:column}
.modal h2{font-size:19px;padding:18px 20px 0}
.mmeta{color:var(--muted);padding:4px 20px 0;font-size:13px}
.mbody{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.mfoot{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.merr{color:var(--bad);padding:0 20px 14px;font-size:13px}
.hist{display:flex;flex-direction:column;gap:8px}
.hist div{padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13px}
.hist .mono{color:var(--muted);font-size:11.5px}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);max-width:min(92vw,520px);text-align:center}
#toast.ok{background:var(--ok);color:#fff}
#toast.bad{background:var(--bad);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.pill-row{display:flex;flex-wrap:wrap;gap:6px}
.pill-row .btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chk{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;background:var(--surface)}
.chk input{margin:0;accent-color:var(--accent)}
.chk:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tagline{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.setcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.setcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start}

/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const todayISO=()=>isoDate(new Date());
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return isoDate(d);};
const weekdayOf=s=>{const w=parseISO(s).getDay();return w===0?7:w;};
const weekStartOf=s=>addDays(s,1-weekdayOf(s));
const monthKeyOf=s=>String(s).slice(0,7);
const daysInMonth=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();};
const monthRange=ym=>[ym+'-01',ym+'-'+pad(daysInMonth(ym))];
const addMonths=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const DAYS=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const DAYS_S=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const monthLabel=ym=>{const [y,m]=ym.split('-').map(Number);return `${MONTHS[m-1]} ${y}`;};
const fmtDate=s=>{const d=parseISO(s);return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`;};
const fmtDateFull=s=>{const d=parseISO(s);return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${DAYS[weekdayOf(s)-1]}`;};
const fmtNum=n=>Number(n||0).toLocaleString('tr-TR');
const fmtTL=n=>Number(n||0).toLocaleString('tr-TR',{maximumFractionDigits:0})+' TL';
const nowStamp=()=>new Date().toISOString();
const fmtStamp=iso=>{if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const byName=(a,b)=>String(a.name||'').localeCompare(String(b.name||''),'tr');
const use=n=>{try{return (window.claude&&typeof window.claude.use==='function')?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);}catch(e){return Promise.resolve(null);}};
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}};
const lsSet=(k,v)=>{try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

/* ===================== derivations ===================== */
function expectedLessons(from,to){
  const out=[];const hol=S().holidays||[];
  for(const a of state.assignments){
    if(a.active===false)continue;
    const wd=Number(a.weekday);if(!(wd>=1&&wd<=7))continue;
    let d=addDays(from,(wd-weekdayOf(from)+7)%7);
    while(d<=to){
      const inRange=(!a.validFrom||d>=a.validFrom)&&(!a.validTo||d<=a.validTo);
      if(inRange&&!hol.some(h=>d>=h.from&&d<=h.to)){
        out.push({id:`${a.id}_${d}`,date:d,teacherId:a.teacherId,schoolId:a.schoolId,assignmentId:a.id,start:a.start||'',plannedHours:Number(a.hours)||0,hours:Number(a.hours)||0,virtual:true});
      }
      d=addDays(d,7);
    }
  }
  return out;
}
function lessonsIn(from,to,teacherId){
  const map=new Map();
  for(const e of expectedLessons(from,to))map.set(e.id,e);
  for(const l of state.lessons){if(l.date>=from&&l.date<=to){const e=map.get(l.id);map.set(l.id,Object.assign({},e||{},l,{virtual:false}));}}
  let arr=[...map.values()];
  if(teacherId)arr=arr.filter(l=>l.teacherId===teacherId);
  return arr.sort((a,b)=>a.date.localeCompare(b.date)||String(a.start||'').localeCompare(String(b.start||''))||tName(a.teacherId).localeCompare(tName(b.teacherId),'tr'));
}
const lessonStatus=l=>l.status==='done'?'done':l.status==='cancelled'?'cancelled':(l.date>todayISO()?'upcoming':'pending');
function rateFor(l){
  if(l.rate!=null&&l.rate!=='')return Number(l.rate)||0;
  const a=state.assignments.find(x=>x.id===l.assignmentId);
  if(a&&a.rate)return Number(a.rate)||0;
  const s=schoolById(l.schoolId);
  return s&&s.rate?Number(s.rate)||0:0;
}
function monthStats(ym,teacherId){
  const [from,to]=monthRange(ym);
  const ls=lessonsIn(from,to,teacherId);
  const rows={};const total={done:0,pending:0,cancelled:0,upcoming:0,extraWait:0,amount:0};
  for(const l of ls){
    const r=rows[l.schoolId]||(rows[l.schoolId]={schoolId:l.schoolId,done:0,pending:0,cancelled:0,upcoming:0,extraWait:0,amount:0});
    const st=lessonStatus(l);
    if(st==='done'){
      const h=Number(l.hours)||0;
      if(l.extra&&!l.approved){r.extraWait+=h;total.extraWait+=h;}
      else{r.done+=h;total.done+=h;const amt=h*rateFor(l);r.amount+=amt;total.amount+=amt;}
    }else if(st==='pending'){r.pending++;total.pending++;}
    else if(st==='cancelled'){r.cancelled++;total.cancelled++;}
    else{r.upcoming++;total.upcoming++;}
  }
  return {rows:Object.values(rows).sort((a,b)=>sName(a.schoolId).localeCompare(sName(b.schoolId),'tr')),total,lessons:ls};
}

function dayAvail(t,wd){
  const tdy=todayISO();
  const as=state.assignments.filter(a=>a.teacherId===t.id&&a.active!==false&&Number(a.weekday)===wd&&!(a.validTo&&a.validTo<tdy));

  return {kind:v==='bos'?'bos':v==='dolu'?'dolu':'',schools:[]};
}

function errText(e){
  const c=e&&e.code;
  if(c==='invalid_argument')return 'Kaydedilemedi: bu hesabın yazma yetkisi yok. Yöneticiden sizi e-posta ile "Düzenleyen" olarak davet etmesini isteyin.';
  if(c==='quota_exceeded')return 'Kaydedilemedi: veri alanı doldu, yöneticiyle görüşün.';
  if(c==='resource_exhausted')return 'Çok sık kayıt denendi. Birkaç saniye bekleyip tekrar deneyin.';
  if(c==='revoked'||c==='not_granted')return 'Erişim izni yok. Sayfayı yeniden açın.';
  return 'Kaydedilemedi, lütfen tekrar deneyin.';
}
async function attempt(fn){try{await fn();return null;}catch(e){console.error(e);return errText(e);}}
const colDoc=(col,id)=>state.db.collection(col).doc(id);
function stripUndef(o){const r={};for(const k in o){if(o[k]!==undefined)r[k]=o[k];}return r;}
async function putDoc(col,obj){const rec=stripUndef(Object.assign({},obj,{updatedAt:nowStamp()}));delete rec.virtual;await colDoc(col,rec.id).set(rec);}
async function delDoc(col,id){await colDoc(col,id).delete();}
function cleanLesson(l){
  const keys=['id','date','teacherId','schoolId','assignmentId','start','plannedHours','hours','status','note','rate','extra','approved','approvedAt','reason','confirmedAt','confirmedBy','createdAt'];
  const r={};for(const k of keys){if(l[k]!==undefined)r[k]=l[k];}
  if(!r.createdAt)r.createdAt=nowStamp();
  return r;
}

function resolveSession(){
  if(state.isOwner){state.session={role:'admin',via:'owner'};return;}
  if(state.uid){const t=state.teachers.find(x=>x.userId===state.uid&&x.active!==false);if(t){state.session={role:'teacher',teacherId:t.id,via:'bound'};return;}}
  const rem=lsGet('ttr.session');
  if(rem&&rem.role==='admin'){state.session={role:'admin',via:'remembered'};return;}
  if(rem&&rem.role==='teacher'){const t=teacherById(rem.teacherId);if(t&&t.active!==false){state.session={role:'teacher',teacherId:t.id,via:'remembered'};return;}}
  state.session=null;
}
const defaultView=()=>isAdmin()?'overview':'tlessons';
function setSession(s,remember){
  state.session=s;state.ui.view=defaultView();
  if(remember!==false){if(s&&s.via!=='impersonate')lsSet('ttr.session',{role:s.role,teacherId:s.teacherId||null});if(!s)lsSet('ttr.session',null);}
  try{history.replaceState(null,'','#'+state.ui.view);}catch(e){}
  render();
  try{window.scrollTo({top:0});}catch(e){}
}
function applyHash(){
  const h=(location.hash||'').replace('#','');
  const nav=isAdmin()?ADMIN_NAV:TEACHER_NAV;
  if(h&&nav.some(n=>n[0]===h))state.ui.view=h;else state.ui.view=defaultView();
}

const STANDALONE=!(window.claude&&typeof window.claude.use==='function');
function localDb(seed){
  const KEY='ttr.local.v1';
  let store=null;
  try{store=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  const fresh=()=>JSON.parse(JSON.stringify(seed||{}));
  if(!store||typeof store!=='object'){store=fresh();persist();}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
  const listeners=new Set();
  function notify(){for(const l of [...listeners]){try{l.fire();}catch(e){console.error(e);}}}
  const clone=v=>JSON.parse(JSON.stringify(v));
  const docSnap=(col,id)=>{const d=store[col]&&store[col][id];return {id,exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}};};
  function docRef(col,id){
    return {id,path:col+'/'+id,
      get:async()=>docSnap(col,id),
      set:async data=>{store[col]=store[col]||{};store[col][id]=clone(data);persist();notify();},
      update:async data=>{if(!(store[col]&&store[col][id]))throw {code:'invalid_argument',message:'missing'};Object.assign(store[col][id],clone(data));persist();notify();},
      delete:async()=>{if(store[col])delete store[col][id];persist();notify();},
      onSnapshot:cb=>{const l={fire:()=>cb(docSnap(col,id))};listeners.add(l);Promise.resolve().then(()=>l.fire());return ()=>listeners.delete(l);},
      collection:sub=>colRef(col+'/'+id+'/'+sub)
    };
  }
  function colRef(col){
    return {path:col,doc:id=>docRef(col,id||uid()),add:async data=>{const r=docRef(col,uid());await r.set(data);return r;},
      onSnapshot:cb=>{const l={fire:()=>{const ids=Object.keys(store[col]||{}).sort();cb({docs:ids.map(id=>docSnap(col,id)),size:ids.length,empty:!ids.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}});}};listeners.add(l);Promise.resolve().then(()=>l.fire());return ()=>listeners.delete(l);}
    };
  }
  return {collection:colRef,doc:path=>{const i=path.lastIndexOf('/');return docRef(path.slice(0,i),path.slice(i+1));},reset:()=>{store=fresh();persist();notify();}};
}

/* ===================== boot ===================== */
function subscribeAll(db){
  const cols=['teachers','schools','assignments','lessons','monthly','sets','candidates'];
  for(const c of cols){
    db.collection(c).onSnapshot(snap=>{state[c]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));state.loaded[c]=true;onData();},e=>{state.dbError=e;render();});
  }
  db.doc('settings/main').onSnapshot(s=>{state.settings=s.exists?s.data():null;state.loaded.settings=true;onData();},e=>{state.dbError=e;render();});
}
async function boot(){
  if(STANDALONE){
    state.standalone=true;state.db=localDb(SEED);state.booted=true;render();subscribeAll(state.db);return;
  }
  const [db,user,downloads]=await Promise.all([use('db'),use('user'),use('downloads')]);
  state.db=db;state.user=user;state.downloads=downloads;
  if(user){try{state.isOwner=await user.isOwner();state.uid=await user.id();state.canWrite=await user.can('data.write');}catch(e){}}
  state.booted=true;
  render();
  if(!db)return;
  subscribeAll(db);
}
function onData(){
  const need=['teachers','schools','assignments','lessons','monthly','sets','candidates','settings'];
  if(!state.ready&&need.every(k=>state.loaded[k])){state.ready=true;resolveSession();applyHash();}
  if(state.ready)render();
}

const chip=(k,t)=>`<span class="chip ${k}">${t}</span>`;
const btn=(act,params,label,cls='ghost sm',extra='')=>`<button type="button" class="btn ${cls}" data-act="${act}" ${Object.entries(params||{}).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')} ${extra}>${label}</button>`;
const field=(label,inner,hint)=>`<label class="fld"><span>${label}</span>${inner}${hint?`<small>${hint}</small>`:''}</label>`;
const input=(name,o={})=>`<input id="f_${name}" name="${name}" type="${o.type||'text'}" value="${esc(o.value==null?'':o.value)}" placeholder="${esc(o.ph||'')}" ${o.req?'required':''} ${o.min!=null?`min="${o.min}"`:''} ${o.max!=null?`max="${o.max}"`:''} ${o.step!=null?`step="${o.step}"`:''} ${o.list?`list="${o.list}"`:''} ${o.attrs||''}>`;
const select=(name,opts,value,o={})=>`<select id="f_${name}" name="${name}" ${o.req?'required':''} ${o.attrs||''}>${o.ph!=null?`<option value="">${esc(o.ph)}</option>`:''}${opts.map(x=>`<option value="${esc(x.v)}" ${String(x.v)===String(value==null?'':value)?'selected':''}>${esc(x.l)}</option>`).join('')}</select>`;
const textarea=(name,value='',ph='')=>`<textarea id="f_${name}" name="${name}" rows="2" placeholder="${esc(ph)}">${esc(value)}</textarea>`;
const tile=(v,label,sub,kind)=>`<div class="tile ${kind||''}"><b>${v}</b><span>${label}${sub?` · ${sub}`:''}</span></div>`;
const monthNav=(ym,act)=>`<div class="nav-month">${btn(act,{dir:-1},'‹','ghost sm')}<b>${monthLabel(ym)}</b>${btn(act,{dir:1},'›','ghost sm')}</div>`;
const weekNav=(ws)=>`<div class="nav-month">${btn('week',{dir:-1},'‹','ghost sm')}<b>${fmtDate(ws)} – ${fmtDate(addDays(ws,6))}</b>${btn('week',{dir:1},'›','ghost sm')}${btn('week',{dir:0},'Bugün','ghost sm')}</div>`;
function statusChip(l){
  const st=lessonStatus(l);
  if(st==='done')return l.extra&&!l.approved?chip('warn','Ek ders · onay bekliyor'):chip('ok','Yapıldı');
  if(st==='cancelled')return chip('bad','Yapılmadı'+(l.reason?' · '+esc(l.reason):''));
  if(st==='pending')return chip('warn',l.date===todayISO()?'Bugün · onay bekliyor':'Onay bekliyor');
  return chip('','Planlı');
}
let toastT;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className=kind||'';t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3400);}
function openModal(o){
  const root=$('#modal-root');root.hidden=false;
  root.innerHTML=`<div class="backdrop" data-mclose></div><div class="modal ${o.wide?'wide':''}" role="dialog" aria-modal="true"><form id="mform" novalidate><h2>${o.title}</h2>${o.meta?`<p class="mmeta">${o.meta}</p>`:''}<div class="mbody">${o.body}</div><p class="merr" id="merr" hidden></p><div class="mfoot">${o.cancel!==false?`<button type="button" class="btn ghost" data-mclose>${o.cancel||'Vazgeç'}</button>`:''}${o.submit!==false?`<button type="submit" class="btn ${o.danger?'danger':'primary'}" id="msubmit">${o.submit||'Kaydet'}</button>`:''}</div></form></div>`;
  modalState={onSubmit:o.onSubmit};
  setTimeout(()=>{const f=root.querySelector('input:not([type=hidden]),select,textarea,button[type=submit]');if(f)f.focus();},40);
}
function closeModal(){const r=$('#modal-root');r.hidden=true;r.innerHTML='';modalState=null;}
function modalErr(msg){const e=$('#merr');if(e){e.textContent=msg;e.hidden=!msg;}}
function confirmModal(title,text,onYes,label='Evet, devam et'){openModal({title,body:`<p>${text}</p>`,submit:label,danger:true,onSubmit:onYes});}
$('#modal-root').addEventListener('click',e=>{if(e.target.closest('[data-mclose]'))closeModal();});
$('#modal-root').addEventListener('change',e=>{const el=e.target.closest('[data-mchange]');if(el)modalChange(el);});
$('#modal-root').addEventListener('submit',async e=>{
  e.preventDefault();if(!modalState)return;
  const f=e.target;const data={};new FormData(f).forEach((v,k)=>{data[k]=typeof v==='string'?v.trim():v;});
  f.querySelectorAll('input[type=checkbox]').forEach(c=>{data[c.name]=c.checked;});
  const sb=$('#msubmit');if(sb)sb.disabled=true;modalErr('');
  try{const err=await modalState.onSubmit(data);if(err){modalErr(err);if(sb)sb.disabled=false;}else closeModal();}
  catch(ex){console.error(ex);modalErr('Beklenmeyen bir hata oluştu.');if(sb)sb.disabled=false;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal-root').hidden)closeModal();});
function modalChange(el){
  if(el.dataset.mchange==='loctype'){
    const v=el.value;const s=$('#loc-school'),t=$('#loc-teacher');
    if(s)s.hidden=v!=='okul';if(t)t.hidden=v!=='ogretmen';
  }
  if(el.dataset.mchange==='teacher-school'){
    const sel=$('#f_schoolId');if(sel){const cur=sel.value;sel.innerHTML=`<option value="">Seçin</option>`+schoolOptions(el.value).map(x=>`<option value="${esc(x.v)}" ${x.v===cur?'selected':''}>${esc(x.l)}</option>`).join('');}
  }
}

/* ===================== render ===================== */
function render(){
  IDX={lessons:{},sets:{}};
  const app=$('#app');
  if(!state.booted){app.innerHTML='<div class="boot">Panel yükleniyor…</div>';return;}
  if(!state.db){app.innerHTML=noDbView();return;}
  if(state.dbError){app.innerHTML=`<div class="nodb"><div class="card"><h2>Veri bağlantısı kesildi</h2><p class="muted">${esc(errText(state.dbError))}</p></div></div>`;return;}
  if(!state.ready){app.innerHTML='<div class="boot">Veriler yükleniyor…</div>';return;}
  if(!state.session){app.innerHTML=loginView();return;}
  const content=isAdmin()?adminView():teacherView();
  app.innerHTML=shell(content);
}

/* ===================== admin views ===================== */
function adminView(){
  switch(state.ui.view){
    case 'school':return schoolDetailView(state.ui.detailId);
    case 'teacher':return teacherDetailView(state.ui.detailId);
    case 'program':return programView();
    case 'avail':return availView();
    case 'lessons':return lessonsView();
    case 'report':return reportView();
    case 'sets':return setsView(true);
    case 'teachers':return teachersView();
    case 'pool':return poolView();
    case 'schools':return schoolsView();
    case 'settings':return settingsView();
    default:return overviewView();
  }
}
function lessonRow(l,o){
  IDX.lessons[l.id]=l;o=o||{};
  const st=lessonStatus(l);
  const locked=o.locked;
  const acts=[];
  if(!locked){
    if(st==='pending'){acts.push(btn('done',{id:l.id},'✓ Derse girdim','primary sm'));acts.push(btn('cancel',{id:l.id},'Yapılmadı','ghost sm'));}
    else if(st==='upcoming'){if(o.admin)acts.push(btn('cancel',{id:l.id},'İptal et','ghost sm'));}
    else{acts.push(btn('done',{id:l.id},'Düzenle','ghost sm'));}
    if(o.admin&&st==='done'&&l.extra&&!l.approved)acts.push(btn('approveExtra',{id:l.id},'Onayla','primary sm'));
    if(o.admin&&!l.virtual)acts.push(btn('resetLesson',{id:l.id},l.extra?'Sil':'Sıfırla','ghost sm'));
    if(!o.admin&&l.extra&&!l.approved)acts.push(btn('resetLesson',{id:l.id},'Sil','ghost sm'));
  }
  const hrs=st==='done'?`${fmtNum(l.hours)} ders`:st==='cancelled'?'—':`${fmtNum(l.plannedHours||l.hours)} ders`;
  return `<div class="lrow ${st}">
    <div class="l-when">${o.showDate!==false?`${fmtDate(l.date)} ${DAYS_S[weekdayOf(l.date)-1]}<br>`:''}${l.start?esc(l.start):''}</div>
    <div class="l-main"><b>${schoolLink(l.schoolId)}</b>${o.showTeacher?` <span class="muted">· ${teacherLink(l.teacherId)}</span>`:''}${l.extra?' '+chip('info','Ek ders'):''}${l.note?`<div class="muted small">${esc(l.note)}</div>`:''}</div>
    <div class="l-hrs">${hrs}</div>
    <div class="l-st">${statusChip(l)}</div>
    <div class="l-act">${acts.join('')}</div>
  </div>`;
}

function weekGrid(ws){
  const days=[0,1,2,3,4,5,6].map(i=>addDays(ws,i));
  const ls=lessonsIn(days[0],days[6]);
  const showWe=ls.some(l=>weekdayOf(l.date)>=6);
  const cols=showWe?7:5;
  const teachers=activeTeachers().filter(t=>ls.some(l=>l.teacherId===t.id));
  if(!teachers.length)return '<p class="empty">Bu hafta planlı ders yok. Haftalık programdan ders günü ekleyin.</p>';
  const t=todayISO();
  const head=days.slice(0,cols).map(d=>`<th class="${d===t?'today':''}">${DAYS_S[weekdayOf(d)-1]} ${fmtDate(d)}</th>`).join('');
  const body=teachers.map(tc=>`<tr><td>${teacherLink(tc.id)}</td>${days.slice(0,cols).map(d=>{const cell=ls.filter(l=>l.teacherId===tc.id&&l.date===d);return `<td>${cell.map(l=>{IDX.lessons[l.id]=l;const st=lessonStatus(l);return `<span class="cell-l ${st}"><b>${esc(sName(l.schoolId))}</b><span class="mono">${l.start?esc(l.start)+' · ':''}${fmtNum(st==='done'?l.hours:(l.plannedHours||l.hours))} ders${l.extra?' · ek':''}</span></span>`;}).join('')}</td>`;}).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table class="tbl wk"><thead><tr><th>Öğretmen</th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function lessonsView(){
  const ym=state.ui.month;const [from,to]=monthRange(ym);
  let ls=lessonsIn(from,to);
  if(state.ui.fTeacher)ls=ls.filter(l=>l.teacherId===state.ui.fTeacher);
  if(state.ui.fSchool)ls=ls.filter(l=>l.schoolId===state.ui.fSchool);
  if(state.ui.fStatus)ls=ls.filter(l=>lessonStatus(l)===state.ui.fStatus);
  const tdy=todayISO();
  const rows=ls.map(l=>{IDX.lessons[l.id]=l;const st=lessonStatus(l);const acts=[];
    if(st==='pending')acts.push(btn('done',{id:l.id},'Yapıldı','primary sm'),btn('cancel',{id:l.id},'Yapılmadı'));
    else if(st==='upcoming')acts.push(btn('cancel',{id:l.id},'İptal'));
    else acts.push(btn('done',{id:l.id},'Düzenle'));
    if(st==='done'&&l.extra&&!l.approved)acts.push(btn('approveExtra',{id:l.id},'Onayla','primary sm'));
    if(!l.virtual)acts.push(btn('resetLesson',{id:l.id},l.extra?'Sil':'Sıfırla'));
    return `<tr class="${l.date===tdy?'today':''}"><td class="mono">${fmtDate(l.date)} <span class="muted">${DAYS_S[weekdayOf(l.date)-1]}</span></td><td>${teacherLink(l.teacherId)}</td><td>${schoolLink(l.schoolId)}${l.extra?' '+chip('info','Ek'):''}</td><td class="mono">${esc(l.start||'')}</td><td class="num">${fmtNum(l.plannedHours||'')}</td><td class="num">${st==='done'?fmtNum(l.hours):''}</td><td>${statusChip(l)}${l.note?`<div class="muted small">${esc(l.note)}</div>`:''}${l.confirmedBy?`<div class="muted small">${esc(l.confirmedBy)} · ${fmtStamp(l.confirmedAt)}</div>`:''}</td><td class="act">${acts.join('')}</td></tr>`;}).join('');
  const sum=ls.reduce((a,l)=>{const st=lessonStatus(l);if(st==='done'&&!(l.extra&&!l.approved))a.done+=Number(l.hours)||0;if(st==='pending')a.pend++;return a;},{done:0,pend:0});

  o=o||{};const days=[0,1,2,3,4,5,6].map(i=>addDays(ws,i));
  const showWe=o.weekend||ls.some(l=>weekdayOf(l.date)>=6)||(o.assignments||[]).some(a=>Number(a.weekday)>=6);
  const cols=showWe?7:5;const t=todayISO();
  const head=days.slice(0,cols).map(d=>`<th class="${d===t?'today':''}">${DAYS_S[weekdayOf(d)-1]} ${fmtDate(d)}</th>`).join('');
  const groups=o.groupBy==='school'?[...new Set(ls.map(l=>l.schoolId))].map(id=>({id,label:schoolLink(id),filter:l=>l.schoolId===id})):[...new Set(ls.map(l=>l.teacherId))].map(id=>({id,label:teacherLink(id),filter:l=>l.teacherId===id}));
  if(!groups.length)return `<p class="empty">${o.empty||'Bu hafta planlı ders yok.'}</p>`;
  const body=groups.map(g=>`<tr><td>${g.label}</td>${days.slice(0,cols).map(d=>{const cell=ls.filter(l=>g.filter(l)&&l.date===d);return `<td>${cell.map(l=>{IDX.lessons[l.id]=l;const st=lessonStatus(l);const title=o.groupBy==='school'?tName(l.teacherId):sName(l.schoolId);return `<span class="cell-l ${st}"><b>${esc(title)}</b><span class="mono">${l.start?esc(l.start)+' · ':''}${fmtNum(st==='done'?l.hours:(l.plannedHours||l.hours))} ders${l.extra?' · ek':''}</span></span>`;}).join('')}</td>`;}).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table class="tbl wk"><thead><tr><th>${o.groupBy==='school'?'Okul':'Öğretmen'}</th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function patternTable(as,o){
  o=o||{};
  if(!as.length)return `<p class="empty">${o.empty||'Program satırı yok.'}</p>`;
  const showWe=as.some(a=>Number(a.weekday)>=6);const cols=showWe?7:5;
  const keyOf=a=>o.groupBy==='school'?a.schoolId:a.teacherId;
  const keys=[...new Set(as.map(keyOf))].sort((x,y)=>(o.groupBy==='school'?sName(x):tName(x)).localeCompare(o.groupBy==='school'?sName(y):tName(y),'tr'));
  const body=keys.map(k=>`<tr><td>${o.groupBy==='school'?schoolLink(k):teacherLink(k)}</td>${[1,2,3,4,5,6,7].slice(0,cols).map(wd=>`<td>${as.filter(a=>keyOf(a)===k&&Number(a.weekday)===wd).sort((x,y)=>String(x.start||'').localeCompare(String(y.start||''))).map(a=>`<span class="cell-l"><b>${esc(o.groupBy==='school'?tName(a.teacherId):sName(a.schoolId))}</b><span class="mono">${a.start?esc(a.start)+' · ':''}${fmtNum(a.hours)} ders</span>${a.note&&o.notes?`<span class="muted small" style="display:block;margin-top:2px">${esc(a.note)}</span>`:''}</span>`).join('')}</td>`).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table class="tbl wk"><thead><tr><th>${o.groupBy==='school'?'Okul':'Öğretmen'}</th>${DAYS.slice(0,cols).map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
}

    approveBox=`<div class="banner ok"><b>${monthLabel(ym)} onaylandı</b> · ${fmtNum(m.teacherHours)} ders saati · ${fmtStamp(m.teacherApprovedAt)}${m.adminApproved?` · Yönetici onayı: ${fmtStamp(m.adminApprovedAt)}`:' · Yönetici onayı bekleniyor'}${m.adminApproved?'':btn('unapproveMonth',{ym},'Onayı geri al','ghost sm')}</div>`;
  }else if(s.total.pending){
    approveBox=`<div class="banner warn">Onaylamadan önce bekleyen ${s.total.pending} dersi işaretleyin ("Derslerim" sekmesi).</div>`;
  }else if(!ended&&s.total.upcoming){
    approveBox=`<div class="banner">Ay bitmeden ay onayı verilemez. Planlı ${s.total.upcoming} ders daha var.</div>`;
  }else if(!s.lessons.length){
    approveBox=`<div class="banner">Bu ayda ders kaydınız yok.</div>`;
  }else{
    approveBox=`<div class="banner"><span><b>${fmtNum(s.total.done)} ders saati</b> girdiniz${s.total.extraWait?` (+${fmtNum(s.total.extraWait)} ek ders yönetici onayı bekliyor)`:''}. Doğruysa ayı onaylayın; onaydan sonra kayıtlar kilitlenir.</span>${btn('approveMonth',{ym},'Bu ayı onayla','primary sm')}</div>`;
  }
  const lessons=s.lessons.map(l=>lessonRow(l,{locked:true})).join('');
  return `<div class="pagehead"><div><h1>Aylık özet</h1><p class="sub">Girdiğiniz ders saatleri sistem tarafından hesaplanır</p></div>${monthNav(ym,'month')}</div>
  <section class="tiles">${tile(fmtNum(s.total.done),'onaylı ders saati')}${tile(s.total.pending,'onay bekleyen ders','',s.total.pending?'warn':'')}${tile(s.total.cancelled,'yapılmayan ders')}${anyRate?tile(fmtTL(s.total.amount),'hesaplanan tutar'):tile(s.total.upcoming,'planlı ders')}</section>
  ${approveBox}
  <section><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Okul</th><th class="num">Onaylı ders saati</th><th class="num">Yapılmadı</th><th class="num">Bekleyen</th><th class="num">Planlı</th>${anyRate?'<th class="num">Tutar</th>':''}</tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">Bu ayda ders yok.</td></tr>'}${rows?`<tr class="total"><td>Toplam</td><td class="num">${fmtNum(s.total.done)}</td><td class="num">${s.total.cancelled||''}</td><td class="num">${s.total.pending||''}</td><td class="num">${s.total.upcoming||''}</td>${anyRate?`<td class="num">${fmtTL(s.total.amount)}</td>`:''}</tr>`:''}</tbody></table></div></section>
  <section><div class="sechead"><h2>${monthLabel(ym)} ders listesi</h2></div>${lessons?`<div class="list">${lessons}</div>`:'<p class="empty">Ders yok.</p>'}</section>`;
}

  if(k==='setsQ'){const box=$('#sets-table');if(box)box.innerHTML=setsTable(filteredSets(),isAdmin());}

$('#app').addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const data={};new FormData(f).forEach((v,k)=>{data[k]=String(v).trim();});
  if(f.dataset.form==='login-teacher'){
    const t=teacherById(data.teacherId);const err=$('#err-teacher');
    if(!t){err.textContent='Adınızı seçin.';return;}
    if(String(t.pin||'')!==data.pin){err.textContent='PIN hatalı. Yöneticinizden PIN\'inizi alın.';return;}
    setSession({role:'teacher',teacherId:t.id,via:'pin'});
    if(state.uid&&!t.userId&&state.canWrite!==false){attempt(()=>putDoc('teachers',Object.assign({},t,{userId:state.uid})));}
  }
  if(f.dataset.form==='login-admin'){
    if(data.pin!==String(S().adminPin)){$('#err-admin').textContent='Yönetici PIN hatalı.';return;}
    setSession({role:'admin',via:'pin'});
  }
});

/* ===================== modals ===================== */
function openDone(l){
  const tid=l.teacherId;const ym=monthKeyOf(l.date);
  if(!isAdmin()&&monthLocked(tid,ym))return toast('Bu ay onaylandığı için kayıt değiştirilemez.','bad');
  const editing=lessonStatus(l)==='done';
  openModal({title:editing?'Ders kaydını düzenle':'Derse girdim',meta:`${fmtDateFull(l.date)} · ${esc(sName(l.schoolId))}${isAdmin()?' · '+esc(tName(l.teacherId)):''}${l.extra?' · ek ders':''}`,
    body:field('Girilen ders saati',input('hours',{type:'number',value:l.hours||l.plannedHours||1,min:1,max:12,step:1,req:true}),l.plannedHours?`Planlanan: ${fmtNum(l.plannedHours)} ders saati`:'')+field('Not (isteğe bağlı)',textarea('note',l.note||'','İşlenen konu, kullanılan set, aksama…')),
    submit:'Kaydet',
    onSubmit:async f=>{const hours=Number(f.hours);if(!(hours>=1&&hours<=12))return 'Ders saati 1 ile 12 arasında olmalı.';
      const rec=Object.assign(cleanLesson(l),{status:'done',hours,note:f.note,rate:rateFor(l),confirmedAt:nowStamp(),confirmedBy:actorLabel(),reason:null});
      if(rec.extra&&rec.approved==null)rec.approved=isAdmin();if(!rec.extra)rec.approved=true;
      const err=await attempt(()=>putDoc('lessons',rec));if(err)return err;toast(editing?'Kayıt güncellendi.':'Ders onaylandı.','ok');}});
}
function openCancel(l){
  const tid=l.teacherId;const ym=monthKeyOf(l.date);
  if(!isAdmin()&&monthLocked(tid,ym))return toast('Bu ay onaylandığı için kayıt değiştirilemez.','bad');
  openModal({title:'Ders yapılmadı',meta:`${fmtDateFull(l.date)} · ${esc(sName(l.schoolId))}${isAdmin()?' · '+esc(tName(l.teacherId)):''}`,
    body:field('Neden',select('reason',CANCEL_REASONS.map(r=>({v:r,l:r})),l.reason||CANCEL_REASONS[0],{req:true}))+field('Açıklama (isteğe bağlı)',textarea('note',l.note||'')),
    submit:'Kaydet',
    onSubmit:async f=>{const rec=Object.assign(cleanLesson(l),{status:'cancelled',hours:0,reason:f.reason,note:f.note,confirmedAt:nowStamp(),confirmedBy:actorLabel()});if(!rec.extra)rec.approved=true;const err=await attempt(()=>putDoc('lessons',rec));if(err)return err;toast('Kaydedildi.','ok');}});
}
function openExtra(){
  const admin=isAdmin();const tid=admin?(activeTeachers()[0]||{}).id:myTeacherId();
  openModal({title:admin?'Ders ekle':'Ek ders ekle',meta:admin?'Programda olmayan bir dersi doğrudan kaydeder.':'Deneme dersi, telafi veya programda olmayan bir ders. Yönetici onayından sonra aylık toplama girer.',
    body:(admin?field('Öğretmen',select('teacherId',activeTeachers().map(t=>({v:t.id,l:t.name})),tid,{req:true,attrs:'data-mchange="teacher-school"'})):'')+`<div class="two">${field('Tarih',input('date',{type:'date',value:todayISO(),req:true,max:admin?null:todayISO()}))}${field('Başlangıç saati',input('start',{type:'time'}))}</div>`+field('Okul',select('schoolId',schoolOptions(tid),'',{req:true,ph:'Seçin'}))+field('Ders saati',input('hours',{type:'number',value:2,min:1,max:12,req:true}))+field('Açıklama',textarea('note','','Deneme dersi, telafi, atölye…')),
    submit:'Kaydet',
    onSubmit:async f=>{const teacherId=admin?f.teacherId:tid;if(!teacherId)return 'Öğretmen seçin.';if(!f.date)return 'Tarih girin.';if(!admin&&f.date>todayISO())return 'Gelecek tarihli ders eklenemez.';if(!f.schoolId)return 'Okul seçin.';const hours=Number(f.hours);if(!(hours>=1&&hours<=12))return 'Ders saati 1 ile 12 arasında olmalı.';
      if(!admin&&monthLocked(teacherId,monthKeyOf(f.date)))return 'Bu ay onaylandığı için ders eklenemez.';
      const school=schoolById(f.schoolId);
      const rec={id:'x_'+uid(),date:f.date,teacherId,schoolId:f.schoolId,start:f.start||'',plannedHours:hours,hours,status:'done',extra:true,approved:admin,note:f.note,rate:school&&school.rate?Number(school.rate):0,confirmedAt:nowStamp(),confirmedBy:actorLabel(),createdAt:nowStamp()};
      const err=await attempt(()=>putDoc('lessons',rec));if(err)return err;toast(admin?'Ders eklendi.':'Ek ders kaydedildi, yönetici onayı bekliyor.','ok');}});
}

    <div class="two">${field('Başlangıç tarihi',input('validFrom',{type:'date',value:a.validFrom||''}))}${field('Bitiş tarihi (isteğe bağlı)',input('validTo',{type:'date',value:a.validTo||''}))}</div>
    ${field('Not',input('note',{value:a.note||'',ph:'Sınıf, şube, kapı bilgisi…'}))}`,
    onSubmit:async f=>{if(!f.teacherId||!f.schoolId)return 'Öğretmen ve okul seçin.';const hours=Number(f.hours);if(!(hours>=1&&hours<=12))return 'Ders saati 1 ile 12 arasında olmalı.';if(f.validTo&&f.validFrom&&f.validTo<f.validFrom)return 'Bitiş tarihi başlangıçtan önce olamaz.';
      const rec=Object.assign({},a,{id:a.id||uid(),teacherId:f.teacherId,schoolId:f.schoolId,weekday:Number(f.weekday),start:f.start||'',hours,rate:f.rate?Number(f.rate):null,validFrom:f.validFrom||null,validTo:f.validTo||null,note:f.note,active:true,createdAt:a.createdAt||nowStamp()});
      const err=await attempt(()=>putDoc('assignments',rec));if(err)return err;toast(isNew?'Program satırı eklendi.':'Program güncellendi.','ok');}});
}
function openTeacher(t,self){
  const isNew=!t;t=t||{active:true};
  openModal({title:self?'Bilgilerimi düzenle':isNew?'Öğretmen ekle':'Öğretmeni düzenle',
    body:field('Ad soyad',input('name',{value:t.name||'',req:true}))+`<div class="two">${field('Telefon',input('phone',{value:t.phone||'',type:'tel'}))}${field('E-posta',input('email',{value:t.email||'',type:'email'}))}</div><div class="two">${field(self?'Giriş PIN':'Giriş PIN (4-6 rakam)',input('pin',{value:t.pin||String(Math.floor(1000+Math.random()*9000)),req:true,attrs:'inputmode="numeric" minlength="4" maxlength="6"'}))}${field('İkamet ilçesi',input('district',{value:t.district||'',ph:'Ümraniye'}))}</div><div class="two">${field('Semt / mahalle',input('semt',{value:t.semt||''}))}${field('Ulaşabileceği diğer ilçeler',input('otherDistricts',{value:t.otherDistricts||'',ph:'Üsküdar, Kadıköy…'}))}</div>`+(self?'':field('Yönetici notu',input('note',{value:t.note||'',ph:'Branş, başlangıç tarihi…'}))),
    onSubmit:async f=>{if(!f.name)return 'Ad soyad girin.';if(!/^\d{4,6}$/.test(f.pin))return 'PIN 4-6 rakamdan oluşmalı.';
      const rec=Object.assign({},t,{id:t.id||uid(),name:f.name,phone:f.phone,email:f.email,pin:f.pin,district:f.district,semt:f.semt,otherDistricts:f.otherDistricts,active:t.active!==false,createdAt:t.createdAt||nowStamp()});
      if(!self)rec.note=f.note;
      const err=await attempt(()=>putDoc('teachers',rec));if(err)return err;toast(self?'Bilgileriniz güncellendi.':isNew?'Öğretmen eklendi.':'Öğretmen güncellendi.','ok');}});
}
function openCandidate(c){
  const isNew=!c;c=c||{status:'aday',days:[]};
  const days=WEEKDAYS6.map(wd=>`<label class="chk"><input type="checkbox" name="d${wd}" ${(c.days||[]).includes(wd)?'checked':''}>${DAYS_S[wd-1]}</label>`).join('');
  openModal({title:isNew?'Arşive öğretmen ekle':'Arşiv kaydını düzenle',wide:true,
    body:`<div class="two">${field('Ad soyad',input('name',{value:c.name||'',req:true}))}${field('Durum',select('status',CAND_STATUS.map(x=>({v:x[0],l:x[1]})),c.status||'aday'))}</div>
    <div class="two">${field('Telefon',input('phone',{value:c.phone||'',type:'tel'}))}${field('E-posta',input('email',{value:c.email||'',type:'email'}))}</div>
    <div class="two">${field('İkamet ilçesi',input('district',{value:c.district||'',ph:'Üsküdar'}))}${field('Semt / mahalle',input('semt',{value:c.semt||''}))}</div>
    ${field('Ulaşabileceği diğer ilçeler',input('otherDistricts',{value:c.otherDistricts||'',ph:'Kadıköy, Ataşehir…'}))}
    ${field('Branş / uzmanlık (virgülle ayırın)',input('tags',{value:candTags(c).join(', '),list:'candtags',ph:'Robotik kodlama, Drone, Okul öncesi…'}))}<datalist id="candtags">${CAND_TAGS.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
    <div class="two">${field('Mezuniyet / eğitim',input('education',{value:c.education||'',ph:'BÖTE, 2021'}))}${field('Deneyim',input('experience',{value:c.experience||'',ph:'3 yıl robotik, Teknofest danışmanlığı'}))}</div>
    <div class="fld"><span>Müsait günler</span><div class="pill-row">${days}</div></div>
    <div class="two">${field('CV bağlantısı (Drive vb.)',input('cvUrl',{value:c.cvUrl||'',type:'url',ph:'https://drive.google.com/…'}))}${field('Kaynak',input('source',{value:c.source||'',ph:'İlan, referans, eğitmen eğitimi…'}))}</div>
    ${field('Notlar',textarea('notes',c.notes||'','Görüşme izlenimi, ücret beklentisi, uygun okul türü…'))}`,
    onSubmit:async f=>{if(!f.name)return 'Ad soyad girin.';if(f.cvUrl&&!safeUrl(f.cvUrl))return 'CV bağlantısı http:// veya https:// ile başlamalı.';
      const tags=String(f.tags||'').split(',').map(s=>s.trim()).filter(Boolean);const days=WEEKDAYS6.filter(wd=>f['d'+wd]);
      const rec=Object.assign({},c,{id:c.id||uid(),name:f.name,status:f.status||'aday',phone:f.phone,email:f.email,district:f.district,semt:f.semt,otherDistricts:f.otherDistricts,tags,education:f.education,experience:f.experience,days,cvUrl:f.cvUrl,source:f.source,notes:f.notes,createdAt:c.createdAt||nowStamp()});
      const err=await attempt(()=>putDoc('candidates',rec));if(err)return err;toast(isNew?'Arşive eklendi.':'Kayıt güncellendi.','ok');}});
}
function openAvail(t){
  const body=WEEKDAYS6.map(wd=>{const a=dayAvail(t,wd);if(a.kind==='okul')return field(DAYS[wd-1],`<div class="pill-row">${a.schools.map(s=>chip('accent',esc(s))).join(' ')}</div>`,'Haftalık programdan gelir');const v=(t.avail||{})[String(wd)]||'';return field(DAYS[wd-1],select('d'+wd,[{v:'',l:'Belirtilmedi'},{v:'bos',l:'Boş · ders verebilir'},{v:'dolu',l:'Dolu'}],v));}).join('');
  openModal({title:isAdmin()?`${esc(t.name)} · müsaitlik`:'Müsaitliğimi güncelle',body:`<div class="two">${body}</div>`+field('Not',input('availNote',{value:t.availNote||'',ph:'Örn. Cuma 10:00 sonrası boş'})),
    onSubmit:async f=>{const avail={};WEEKDAYS6.forEach(wd=>{const v=f['d'+wd];if(v==='bos'||v==='dolu')avail[String(wd)]=v;});
      const err=await attempt(()=>putDoc('teachers',Object.assign({},t,{avail,availNote:f.availNote,availUpdatedAt:nowStamp(),formStatus:'Tamam'})));if(err)return err;toast('Müsaitlik güncellendi.','ok');}});
}
function openSchool(s){
  const isNew=!s;s=s||{active:true,kind:'okul'};
  openModal({title:isNew?'Kurum ekle':'Kurumu düzenle',
    body:`<div class="two">${field('Kurum adı',input('name',{value:s.name||'',req:true}))}${field('Tür',select('kind',SCHOOL_KINDS.map(x=>({v:x[0],l:x[1]})),s.kind||'okul'))}</div><div class="two">${field('İlçe / semt',input('district',{value:s.district||''}))}${field('Ders saati ücreti (TL)',input('rate',{type:'number',value:s.rate||'',min:0,step:1,ph:'isteğe bağlı'}))}</div><div class="two">${field('Yetkili kişi',input('contact',{value:s.contact||''}))}${field('Telefon',input('phone',{value:s.phone||'',type:'tel'}))}</div>`+field('Adres',input('address',{value:s.address||'',ph:'Mahalle, cadde, no'}))+field('Not',input('note',{value:s.note||'',ph:'Dolap, giriş, özel durum…'})),
    onSubmit:async f=>{if(!f.name)return 'Kurum adı girin.';const rec=Object.assign({},s,{id:s.id||uid(),name:f.name,kind:f.kind||'okul',district:f.district,rate:f.rate?Number(f.rate):null,contact:f.contact,phone:f.phone,address:f.address,note:f.note,active:s.active!==false,createdAt:s.createdAt||nowStamp()});const err=await attempt(()=>putDoc('schools',rec));if(err)return err;toast(isNew?'Kurum eklendi.':'Kurum güncellendi.','ok');}});
}
function locFields(locType,locId){
  return `${field('Nerede / kimde',select('locType',[{v:'depo',l:'Depo (TT Robotics)'},{v:'okul',l:'Okulda'},{v:'ogretmen',l:'Öğretmende (zimmet)'}],locType||'depo',{attrs:'data-mchange="loctype"'}))}
  <div id="loc-school" ${locType==='okul'?'':'hidden'}>${field('Okul',select('schoolId',activeSchools().map(s=>({v:s.id,l:s.name})),locType==='okul'?locId:'',{ph:'Seçin'}))}</div>
  <div id="loc-teacher" ${locType==='ogretmen'?'':'hidden'}>${field('Öğretmen',select('teacherId',activeTeachers().map(t=>({v:t.id,l:t.name})),locType==='ogretmen'?locId:'',{ph:'Seçin'}))}</div>`;
}
function resolveLoc(f){const type=f.locType||'depo';const id=type==='okul'?f.schoolId:type==='ogretmen'?f.teacherId:'';if(type!=='depo'&&!id)return null;return {locType:type,locId:id||''};}
function openSet(s){
  const isNew=!s;s=s||{code:nextSetCode(),qty:1,status:'aktif',locType:'depo'};
  openModal({title:isNew?'Set ekle':'Seti düzenle',
    body:`<div class="two">${field('Kod',input('code',{value:s.code||'',req:true}))}${field('Adet',input('qty',{type:'number',value:s.qty||1,min:1,req:true}))}</div>`+field('Set adı',input('name',{value:s.name||'',req:true,ph:'LEGO SPIKE Prime 45678…'}))+`<div class="two">${field('Kategori',input('category',{value:s.category||'',list:'setcats'}))+'<datalist id="setcats">'+SET_CATS.map(c=>`<option value="${esc(c)}">`).join('')+'</datalist>'}${field('Durum',select('status',SET_STATUS.map(x=>({v:x[0],l:x[1]})),s.status||'aktif'))}</div>`+locFields(s.locType,s.locId)+field('Not',input('note',{value:s.note||'',ph:'Seri no, eksik parça, pil durumu…'})),
    onSubmit:async f=>{if(!f.code||!f.name)return 'Kod ve set adı girin.';const loc=resolveLoc(f);if(!loc)return 'Okul veya öğretmen seçin.';
      const hist=(s.history||[]).slice();const to=locLabel(loc.locType,loc.locId);const from=s.id?locLabel(s.locType,s.locId):'';
      if(isNew)hist.push({at:nowStamp(),to,by:actorLabel(),note:'Kayıt oluşturuldu'});else if(loc.locType!==s.locType||loc.locId!==s.locId)hist.push({at:nowStamp(),from,to,by:actorLabel(),note:'Düzenleme ile taşındı'});
      const rec=Object.assign({},s,{id:s.id||uid(),code:f.code,name:f.name,category:f.category,qty:Number(f.qty)||1,status:f.status,note:f.note},loc,{history:hist.slice(-50),createdAt:s.createdAt||nowStamp()});
      const err=await attempt(()=>putDoc('sets',rec));if(err)return err;toast(isNew?'Set eklendi.':'Set güncellendi.','ok');}});
}
function openMove(s){
  const admin=isAdmin();const me=myTeacherId();
  let def=s.locType||'depo';if(!admin){def=s.locType==='ogretmen'&&s.locId===me?'okul':'ogretmen';}
  const body=admin?locFields(def,s.locId):`${field('Yeni yeri',select('locType',[{v:'ogretmen',l:'Üzerime aldım (zimmet)'},{v:'okul',l:'Okula bıraktım'},{v:'depo',l:'Depoya teslim ettim'}],def,{attrs:'data-mchange="loctype"'}))}<div id="loc-school" ${def==='okul'?'':'hidden'}>${field('Okul',select('schoolId',schoolOptions(me),def==='okul'?s.locId:'',{ph:'Seçin'}))}</div><div id="loc-teacher" hidden><input type="hidden" name="teacherId" value="${esc(me)}"></div>`;
  openModal({title:'Seti taşı',meta:`${esc(s.code||'')} ${esc(s.name)} · şu an: ${esc(locLabel(s.locType,s.locId))}`,
    body:body+field('Not',input('note',{ph:'Dolap, teslim alan kişi, eksik parça…'})),submit:'Kaydet',
    onSubmit:async f=>{if(!admin&&f.locType==='ogretmen')f.teacherId=me;const loc=resolveLoc(f);if(!loc)return 'Okul veya öğretmen seçin.';if(loc.locType===s.locType&&loc.locId===s.locId)return 'Set zaten burada.';
      const hist=(s.history||[]).concat([{at:nowStamp(),from:locLabel(s.locType,s.locId),to:locLabel(loc.locType,loc.locId),by:actorLabel(),note:f.note}]).slice(-50);
      const err=await attempt(()=>putDoc('sets',Object.assign({},s,loc,{history:hist})));if(err)return err;toast('Set hareketi kaydedildi.','ok');}});
}

boot();
})();
</script>
