<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="TT Robotics öğretmen ve yönetici paneli.">
<title>TT Robotics Öğretmen Yönetici Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: TT Robotics site language — navy sidebar with the wing logo, ice-blue page ground, large-radius white cards, Bricolage Grotesque display + Karla body, #0067FF action blue. */
:root{
  --navy:#0E2156; --navy-2:#1E3A8A; --blue:#0067FF; --blue-2:#1863DC; --ice:#E7F6FF;
  --bg:#EDF5FC; --surface:#FFFFFF; --surface-2:#F1F7FD; --line:#D9E6F2; --fg:#0F172A; --muted:#5B6B82;
  --accent:#0067FF; --accent-fg:#FFFFFF; --accent-soft:#E2EEFF;
  --side-bg:#0E2156; --side-fg:#C7D6F2; --side-on:#FFFFFF; --side-on-bg:rgba(255,255,255,.12); --side-line:rgba(255,255,255,.10);
  --ok:#15803D; --ok-soft:#DCFCE7; --tt-trial:#7C3AED; --tt-trial-soft:#F1EAFE; --warn:#A16207; --warn-soft:#FEF3C7; --bad:#B91C1C; --bad-soft:#FEE2E2; --info:#1E3A8A; --info-soft:#E7F6FF;
  --display:'Bricolage Grotesque','Karla',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font:'Karla',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px; --shadow:0 1px 2px rgba(14,33,86,.05),0 14px 36px -18px rgba(14,33,86,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --surface:#121B2E; --surface-2:#182540; --line:#263654; --fg:#E8EEF8; --muted:#9AAAC4;
    --accent:#5B9BFF; --accent-fg:#071020; --accent-soft:#1A2D52; --ice:#13213C;
    --side-bg:#0A1430; --side-fg:#AFC0E0; --side-on:#FFFFFF; --side-on-bg:rgba(255,255,255,.12); --side-line:rgba(255,255,255,.08);
    --ok:#4ADE80; --ok-soft:#113022; --warn:#FACC15; --warn-soft:#3A2E0B; --bad:#F87171; --bad-soft:#3B1515; --info:#9DB8F5; --info-soft:#172544;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 36px -18px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121B2E; --surface-2:#182540; --line:#263654; --fg:#E8EEF8; --muted:#9AAAC4;
  --accent:#5B9BFF; --accent-fg:#071020; --accent-soft:#1A2D52; --ice:#13213C;
  --side-bg:#0A1430; --side-fg:#AFC0E0; --side-on:#FFFFFF; --side-on-bg:rgba(255,255,255,.12); --side-line:rgba(255,255,255,.08);
  --ok:#4ADE80; --ok-soft:#113022; --warn:#FACC15; --warn-soft:#3A2E0B; --bad:#F87171; --bad-soft:#3B1515; --info:#9DB8F5; --info-soft:#172544;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 36px -18px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2;font-family:var(--display);letter-spacing:-.01em}
h1{font-size:28px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.boot,.nodb{min-height:60vh;display:grid;place-items:center;padding:24px 16px;text-align:center;color:var(--muted)}
.nodb .card{max-width:460px;text-align:left}
/* app frame */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;padding:22px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.side .logo{display:block;width:150px;margin:6px auto 8px;height:auto;filter:drop-shadow(0 0 14px rgba(0,103,255,.45))}
.side .role{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-fg);opacity:.8;margin-bottom:22px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--side-fg);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.side nav a:hover{background:var(--side-line);color:var(--side-on)}
.side nav a.on{background:var(--side-on-bg);color:var(--side-on)}
.side nav a .ic{width:18px;height:18px;flex:none;opacity:.85}
.side .user{margin-top:auto;padding-top:16px;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:8px}
.side .user .name{color:var(--side-on);font-weight:600;font-family:var(--display);font-size:15px;overflow:hidden;text-overflow:ellipsis}
.side .user .btn{background:transparent;border-color:var(--side-line);color:var(--side-on)}
.side .user .btn:hover{background:var(--side-line)}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
main{padding-block:28px 56px;padding-inline:32px;min-width:0;display:flex;flex-direction:column;gap:26px;max-width:1280px;width:100%}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:12px 16px;flex-direction:row;align-items:center;gap:12px;overflow:visible}
  .side .logo{width:84px;margin:0;filter:drop-shadow(0 0 8px rgba(0,103,255,.4))}
  .side .role{display:none}
  .side nav{display:none}
  .side .user{margin:0 0 0 auto;padding:0;border:0;flex-direction:row;align-items:center}
  .side .user .name{display:none}
  .topbar{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;scrollbar-width:none}
  .topbar a{white-space:nowrap;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--fg);font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface)}
  .topbar a.on{background:var(--navy);border-color:var(--navy);color:#fff}
  main{padding-inline:16px;padding-block:18px 40px;gap:20px}
  h1{font-size:24px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{padding:12px 14px}
  .tile b{font-size:26px}
  .hero{padding:18px 18px}
  .hero h1{font-size:26px}
}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead .sub{margin-top:4px}
.sub{color:var(--muted)}
section{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbl.avail td:first-child{min-width:220px;max-width:320px}
.tbl.avail td:not(:first-child){white-space:nowrap;width:1%}
.tbl.avail td:not(:first-child) .chip{white-space:normal;max-width:160px;text-align:left}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.tile b{font-size:32px;font-weight:600;font-family:var(--display);font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.02em;color:var(--navy-2)}
:root[data-theme="dark"] .tile b{color:var(--fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile b{color:var(--fg)}}
.tile span{color:var(--muted);font-size:13px}
.tile.warn{border-color:var(--warn);background:var(--warn-soft)}
.tile.warn span{color:var(--fg)}
.tile.warn b{color:var(--warn)}
/* cards & tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card.tight{padding:0;overflow:hidden}
.tt th[scope=row]{width:120px;font-size:14px;font-weight:700;background:var(--surface-2);white-space:nowrap}
.tt th[scope=row] small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted)}
.tt tr.today th[scope=row]{color:var(--accent)}
.tt td{padding:8px}
.ttrow{display:flex;flex-wrap:wrap;gap:8px}
.ttc{--c:var(--line);--b:var(--accent-soft);display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;color:var(--fg);background:var(--b);border:1.5px solid var(--c);border-radius:10px;padding:8px 10px;min-width:170px;max-width:260px;flex:1 1 170px;cursor:pointer}
.ttc:hover{filter:brightness(.97)}.ttc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ttc.ttmini{min-width:0;max-width:none;flex:none;width:100%;padding:3px 6px;gap:0;border-radius:7px;font-size:11.5px;line-height:1.25;margin-top:3px}
.ttc.ttmini .ttc-sc{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttm-n{font-size:11px;color:var(--muted)}
table.ttm{table-layout:fixed;min-width:760px}
table.ttm th,table.ttm td{vertical-align:top;padding:6px}
table.ttm thead th{text-align:center;font-size:12px}
table.ttm thead th:first-child{width:86px}table.ttm thead th:last-child{width:112px}
.ttm-wk{font-size:12px;white-space:nowrap}.ttm-wk small{display:block;font-weight:400;color:var(--muted)}
.ttm-d{min-height:64px}.ttm-d.out{background:var(--bg);opacity:.45}.ttm-d.today{background:var(--accent-soft)}
.ttm-day{display:block;font-size:11px;color:var(--muted);font-weight:600}
.ttm-tot{white-space:nowrap}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.tcard:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}.tcard b{font-size:15px}
.tdetails>summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--accent)}
.ttc-day{font-weight:700;padding:0 6px;border-radius:6px;background:var(--ok-soft);color:var(--ok)}.ttc-day.yarim{background:var(--warn-soft);color:var(--warn)}
.ttmode{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg .btn,.seg button{border:0;border-radius:999px;background:transparent;box-shadow:none}
.seg .on{background:var(--accent);color:#fff}
.ttc.today{box-shadow:0 0 0 2px var(--accent)}
.ttc-sc{font-weight:700;font-size:13px;line-height:1.25}
.ttc-cl{font-size:12.5px;font-weight:600}.ttc-cl .n{font-family:var(--mono);font-weight:400;color:var(--muted)}
.ttc-mt{display:flex;flex-wrap:wrap;gap:2px 10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.ttc-tag{font-size:11px;font-weight:700;color:var(--info)}
.ttc-st{font-size:11px;font-weight:800;letter-spacing:.02em;margin-top:2px}
.ttc.plan{--c:var(--line);--b:var(--accent-soft)}.ttc.plan .ttc-st{color:var(--muted)}
.ttc.wait{--c:var(--warn);--b:var(--warn-soft)}.ttc.wait .ttc-st{color:var(--warn)}
.ttc.done{--c:var(--ok);--b:var(--ok-soft)}.ttc.done .ttc-st{color:var(--ok)}
.ttc.miss{--c:var(--bad);--b:var(--bad-soft)}.ttc.miss .ttc-st{color:var(--bad)}
.ttc.trial{--c:var(--tt-trial);--b:var(--tt-trial-soft)}.ttc.trial .ttc-st{color:var(--tt-trial)}
.ttlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.ttlegend span{display:inline-flex;align-items:center;gap:6px}.ttlegend i{width:13px;height:13px;border-radius:4px;border:1.5px solid var(--line);background:var(--accent-soft)}
.ttlegend i.wait{border-color:var(--warn);background:var(--warn-soft)}.ttlegend i.done{border-color:var(--ok);background:var(--ok-soft)}.ttlegend i.miss{border-color:var(--bad);background:var(--bad-soft)}.ttlegend i.trial{border-color:var(--tt-trial);background:var(--tt-trial-soft)}
.ttsums{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
.ttsum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:5px;min-width:0}
.ttsum.lead{border-color:var(--accent)}
.ttsum h3{margin:0;font-size:12.5px;color:var(--muted);font-weight:600}
.ttsum .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.ttsum .big small{font-size:14px;color:var(--muted);font-weight:600}
.ttbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}.ttbar span{display:block;height:100%}
.ttmenu{position:fixed;z-index:60;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(10,20,50,.28);padding:6px;display:grid;gap:2px;min-width:240px;max-width:min(320px,calc(100vw - 16px))}
.ttmenu h4{margin:4px 8px 6px;font-size:12px;color:var(--muted);font-weight:600}
.ttmenu button{font:inherit;font-size:13.5px;text-align:left;padding:9px 10px;border-radius:8px;border:0;background:none;color:var(--fg);cursor:pointer}
.ttmenu button:hover,.ttmenu button:focus-visible{background:var(--surface-2);outline:none}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.tbl-wrap.wide{scrollbar-width:none}.tbl-wrap.wide::-webkit-scrollbar{display:none}
.hbar{position:sticky;bottom:0;z-index:5;overflow-x:auto;overflow-y:hidden;height:16px;margin-top:-2px;background:var(--surface-2);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;scrollbar-width:auto}
.hbar>div{height:1px}
.hbar::-webkit-scrollbar{height:14px}.hbar::-webkit-scrollbar-thumb{background:var(--muted);border-radius:8px;border:3px solid var(--surface-2)}
.wide-hint{display:none}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;background:var(--surface-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl tr.total td{font-weight:700;background:var(--surface-2)}
.tbl .today td{background:var(--accent-soft)}
.tbl th.today{color:var(--accent)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;line-height:1.2;text-decoration:none;font-size:13.5px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:0 6px 16px -8px rgba(0,103,255,.6)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.side nav a:focus-visible,.topbar a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toolbar .grow{flex:1 1 auto}
.toolbar select,.toolbar input{width:auto}
.nav-month{display:inline-flex;align-items:center;gap:4px}
.nav-month b{min-width:130px;text-align:center;font-weight:600;font-family:var(--display)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
/* lesson rows */
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;border-left-width:5px;box-shadow:var(--shadow)}
.lrow.done{border-left-color:var(--ok)}
.lrow.pending{border-left-color:var(--warn)}
.lrow.cancelled{border-left-color:var(--bad)}
.lrow.upcoming{border-left-color:var(--line)}
.lrow .l-when{font-family:var(--mono);font-size:12.5px;color:var(--muted);line-height:1.3;min-width:0}
.lrow .l-when:empty{display:none}
.lrow .l-main b{font-weight:700;font-family:var(--display);font-size:15px}
.lrow .l-hrs{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:64px}
.lrow .l-st{white-space:nowrap}
.lrow .l-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:720px){
  .lrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"when st" "main main" "hrs act"}
  .lrow .l-when{grid-area:when}.lrow .l-st{grid-area:st}.lrow .l-main{grid-area:main}.lrow .l-hrs{grid-area:hrs}.lrow .l-act{grid-area:act}
}
.daygroup{display:flex;flex-direction:column;gap:6px}
.daygroup h3{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:8px;font-family:var(--font);font-weight:700}
.daygroup h3.today{color:var(--accent)}
.empty{color:var(--muted);padding:18px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center;background:var(--surface)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-radius:var(--r-sm);background:var(--info-soft);color:var(--info);border:1px solid transparent}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.note{padding:12px 14px;border-radius:var(--r-sm);background:var(--ice);color:var(--muted);font-size:12.5px;line-height:1.55}
/* hero (overview) */
.hero{background:var(--navy);color:#fff;border-radius:var(--r);padding:22px 24px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(0,103,255,.55),rgba(0,103,255,0) 70%);pointer-events:none}
.hero .wm{position:absolute;right:-10px;top:50%;transform:translateY(-50%) rotate(-8deg);width:190px;height:auto;opacity:.09;pointer-events:none}
.hero>div{position:relative;z-index:1}
.hero .toolbar{justify-content:flex-end}
@media (max-width:900px){.hero .wm{width:90px;right:14px;top:14px;transform:none}}
.hero h1{color:#fff;font-size:30px}
.hero .sub{color:#C7D6F2}
.hero .eyebrow{color:#8FB4FF}
.hero .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;position:relative}
.hero .btn.primary{background:var(--blue);border-color:var(--blue)}
/* week grid */
.wk td{min-width:150px;vertical-align:top}
.wk td:first-child{min-width:150px;font-weight:700;font-family:var(--display)}
.cell-l{display:block;padding:6px 9px;border-radius:8px;margin:2px 0;background:var(--surface-2);border-left:3px solid var(--line);font-size:12.5px;line-height:1.3}
.cell-l.done{border-left-color:var(--ok)}.cell-l.pending{border-left-color:var(--warn)}.cell-l.cancelled{border-left-color:var(--bad);text-decoration:line-through;opacity:.8}
.cell-l b{display:block;font-weight:700}
.cell-l .mono{color:var(--muted);font-size:11.5px}
.mgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:600px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbl.pay td,.tbl.pay th{padding:8px 9px}
.tbl.pay td:first-child{min-width:200px;max-width:260px}
.tbl.pay td.num{white-space:nowrap}
input[type=file]{width:100%;border:1px dashed var(--line);background:var(--surface-2);border-radius:10px;padding:10px}
/* forms */
.fld{display:flex;flex-direction:column;gap:5px}
.setsug-wrap{position:relative}
.setsug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:240px;overflow:auto;padding:4px}
.setsug-i{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;font:inherit;color:inherit;cursor:pointer}
.setsug-i:hover{background:var(--line)}
.setsug-new{color:var(--accent,#1a73e8);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 8px 8px}
.fld>span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.fld small{color:var(--muted);font-size:11.5px}
.fld.row{flex-direction:row;align-items:center;gap:8px}
input:not([type=checkbox]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.ferr{color:var(--bad);font-size:12.5px;min-height:1em}
/* login */
.login-wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.login-side{background:var(--navy);color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative;overflow:hidden}
.login-side::before{content:"";position:absolute;left:-120px;bottom:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(0,103,255,.6),rgba(0,103,255,0) 70%)}
.login-side .logo{width:min(260px,70%);height:auto;position:relative;filter:drop-shadow(0 0 28px rgba(0,103,255,.55))}
.login-side h1{color:#fff;font-size:34px;line-height:1.15;position:relative;max-width:22ch}
.login-side p{color:#C7D6F2;position:relative;max-width:46ch}
.login-side .pts{display:flex;flex-direction:column;gap:10px;position:relative}
.login-side .pts div{display:flex;gap:10px;align-items:flex-start;color:#E3ECFF;font-size:14px}
.login-side .pts span{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:7px;flex:none}
.login-side .foot{font-size:12px;color:#8FA3CC;position:relative}
.login{padding:48px 40px;display:flex;flex-direction:column;gap:18px;justify-content:center;max-width:560px;width:100%;margin:0 auto}
.login .card{gap:14px}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 6px}
.login-brand img{width:min(300px,80%);height:auto}
.login-cards{display:flex;flex-direction:column;gap:16px}
.card-head{display:flex;align-items:center;gap:14px}
.card-ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.card-ic .ic{width:22px;height:22px}
.plink{color:inherit;text-decoration:none;font-weight:700;border-bottom:1.5px solid var(--accent-soft)}
.plink:hover{color:var(--accent);border-bottom-color:var(--accent)}
.tbl td .plink{font-family:var(--display);font-size:14.5px}
@media (max-width:900px){
  .login-wrap{grid-template-columns:minmax(0,1fr)}
  .login-side{padding:28px 20px;gap:22px}
  .login-side h1{font-size:26px}
  .login-side .logo{width:150px}
  .login-side .pts{display:none}
  .login{padding:22px 16px 40px}
  .login-brand{display:none}
}
/* modal */
#modal-root{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.backdrop{position:absolute;inset:0;background:rgba(8,20,48,.55);backdrop-filter:blur(2px)}
.modal{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal.wide{width:min(760px,100%)}
.modal form{display:flex;flex-direction:column}
.modal h2{font-size:19px;padding:18px 20px 0}
.mmeta{color:var(--muted);padding:4px 20px 0;font-size:13px}
.mbody{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.mfoot{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.merr{color:var(--bad);padding:0 20px 14px;font-size:13px}
.hist{display:flex;flex-direction:column;gap:8px}
.hist div{padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13px}
.hist .mono{color:var(--muted);font-size:11.5px}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);max-width:min(92vw,520px);text-align:center}
#toast.ok{background:var(--ok);color:#fff}
#toast.bad{background:var(--bad);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.pill-row{display:flex;flex-wrap:wrap;gap:6px}
.pill-row .btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chk{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;background:var(--surface)}
.chk input{margin:0;accent-color:var(--accent)}
.chk:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tagline{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.setcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.setcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}}
.agr-box{max-height:60vh;overflow:auto;background:#fff;color:#111;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:8px 0}
.agr-box .agr-doc{color:#111}.agr-box h2.pb{border-top:1px dashed #bbb;padding-top:14px}
.agr-steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}.agr-steps li{display:flex;gap:8px;align-items:center}.agr-steps li b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent)}.agr-steps li.ok b{background:var(--ok-soft,#dff3e4);color:var(--ok,#1a7f3c)}
.agr-checks{display:grid;gap:8px;margin-top:10px}.agr-checks label{display:flex;gap:8px;align-items:flex-start}.agr-checks input{margin-top:3px}
section.card{margin-bottom:14px}
</style>

function expectedLessons(from,to){
  const out=[];const hol=S().holidays||[];
  for(const a of state.assignments){
    if(a.active===false)continue;
    const wd=Number(a.weekday);if(!(wd>=1&&wd<=7))continue;
    let d=addDays(from,(wd-weekdayOf(from)+7)%7);
    while(d<=to){
      const inRange=(!a.validFrom||d>=a.validFrom)&&(!a.validTo||d<=a.validTo);
      if(inRange&&!hol.some(h=>d>=h.from&&d<=h.to)){
        out.push({id:`${a.id}_${d}`,date:d,teacherId:a.teacherId,schoolId:a.schoolId,assignmentId:a.id,start:a.start||'',plannedHours:Number(a.hours)||0,hours:Number(a.hours)||0,virtual:true});
      }
      d=addDays(d,7);
    }
  }
  return out;
}
function lessonsIn(from,to,teacherId){
  const map=new Map();
  for(const e of expectedLessons(from,to))map.set(e.id,e);
  for(const l of state.lessons){if(l.date>=from&&l.date<=to){const e=map.get(l.id);map.set(l.id,Object.assign({},e||{},l,{virtual:false}));}}
  let arr=[...map.values()];
  if(teacherId)arr=arr.filter(l=>l.teacherId===teacherId);
  return arr.sort((a,b)=>a.date.localeCompare(b.date)||String(a.start||'').localeCompare(String(b.start||''))||tName(a.teacherId).localeCompare(tName(b.teacherId),'tr'));
}
const lessonStatus=l=>l.status==='done'?'done':l.status==='cancelled'?'cancelled':(l.date>todayISO()?'upcoming':'pending');
function rateFor(l){
  if(Number(l.rate)>0)return Number(l.rate);
  const a=state.assignments.find(x=>x.id===l.assignmentId);
  if(a&&a.rate)return Number(a.rate)||0;
  const s=schoolById(l.schoolId);
  if(s&&s.rate)return Number(s.rate)||0;
  const c=(state.contracts||[]).find(x=>x.schoolId===l.schoolId);
  return c&&c.teacherRate?Number(c.teacherRate)||0:0;
}
function lessonsOfMonth(ym,tid){const [f,t]=monthRange(ym);const a=lessonsIn(f,t,tid).filter(l=>!l.payMonth||l.payMonth===ym);const moved=state.lessons.filter(l=>l.payMonth===ym&&monthKeyOf(l.date)!==ym&&(!tid||l.teacherId===tid)).map(l=>Object.assign({},l,{virtual:false}));return a.concat(moved);}
function monthStats(ym,teacherId){
  const ls=lessonsOfMonth(ym,teacherId);
  const rows={};const total={done:0,pending:0,cancelled:0,upcoming:0,extraWait:0,amount:0,makeup:0,trial:0};
  for(const l of ls){
    const r=rows[l.schoolId]||(rows[l.schoolId]={schoolId:l.schoolId,done:0,pending:0,cancelled:0,upcoming:0,extraWait:0,amount:0});
    const st=lessonStatus(l);
    if(st==='done'){
      const h=Number(l.hours)||0;
      if(l.makeupFor){r.makeup=(r.makeup||0)+h;total.makeup+=h;}
      if(l.trial){r.trial=(r.trial||0)+h;total.trial+=h;}
      else if(l.extra&&!l.approved){r.extraWait+=h;total.extraWait+=h;}
      else{r.done+=h;total.done+=h;const amt=h*rateFor(l);r.amount+=amt;total.amount+=amt;}
    }else if(st==='pending'){r.pending++;total.pending++;}
    else if(st==='cancelled'){r.cancelled++;total.cancelled++;}
    else{r.upcoming++;total.upcoming++;}
  }
  return {rows:Object.values(rows).sort((a,b)=>sName(a.schoolId).localeCompare(sName(b.schoolId),'tr')),total,lessons:ls};
}

  if(state.uid){const t=state.teachers.find(x=>x.userId===state.uid&&x.active!==false);if(t){state.session={role:'teacher',teacherId:t.id,via:'bound'};return;}}

/* ===================== standalone store (GitHub Pages / local preview) ===================== */
const SEED=/*__SEED__*/null;
const STANDALONE=!(window.claude&&typeof window.claude.use==='function');
function localDb(seed){
  const KEY='ttr.local.v1';
  let store=null;
  try{store=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  const fresh=()=>JSON.parse(JSON.stringify(seed||{}));
  if(!store||typeof store!=='object'){store=fresh();persist();}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
  const listeners=new Set();
  function notify(){for(const l of [...listeners]){try{l.fire();}catch(e){console.error(e);}}}
  const clone=v=>JSON.parse(JSON.stringify(v));
  const docSnap=(col,id)=>{const d=store[col]&&store[col][id];return {id,exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}};};
  function docRef(col,id){
    return {id,path:col+'/'+id,
      get:async()=>docSnap(col,id),
      set:async data=>{store[col]=store[col]||{};store[col][id]=clone(data);persist();notify();},
      update:async data=>{if(!(store[col]&&store[col][id]))throw {code:'invalid_argument',message:'missing'};Object.assign(store[col][id],clone(data));persist();notify();},
      delete:async()=>{if(store[col])delete store[col][id];persist();notify();},
      onSnapshot:cb=>{const l={fire:()=>cb(docSnap(col,id))};listeners.add(l);Promise.resolve().then(()=>l.fire());return ()=>listeners.delete(l);},
      collection:sub=>colRef(col+'/'+id+'/'+sub)
    };
  }
  function colRef(col){
    return {path:col,doc:id=>docRef(col,id||uid()),add:async data=>{const r=docRef(col,uid());await r.set(data);return r;},
      onSnapshot:cb=>{const l={fire:()=>{const ids=Object.keys(store[col]||{}).sort();cb({docs:ids.map(id=>docSnap(col,id)),size:ids.length,empty:!ids.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}});}};listeners.add(l);Promise.resolve().then(()=>l.fire());return ()=>listeners.delete(l);}
    };
  }
  return {collection:colRef,doc:path=>{const i=path.lastIndexOf('/');return docRef(path.slice(0,i),path.slice(i+1));},reset:()=>{store=fresh();persist();notify();}};
}

/* ===================== remote database (GitHub sürümü → Google E-Tablolar) ===================== */
const REMOTE="https://script.google.com/macros/s/AKfycbyKaX0DguCzD5WJA90oZqwAehEGqUB3oMMtQrdQ7BBc8Qj2-ozfG1p0jAUifAmsoNL0qg/exec";
function remoteDb(url){
  let store={};let cred=null;let who=null;const listeners=new Set();
  const clone=v=>JSON.parse(JSON.stringify(v));
  function notify(){for(const l of [...listeners]){try{l.fire();}catch(e){console.error(e);}}}
  async function call(payload){
    let r;try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});}catch(e){throw {code:'network',message:'Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edin.'};}
    let j;try{j=await r.json();}catch(e){throw {code:'server',message:'Sunucudan geçersiz yanıt geldi.'};}
    if(!j.ok)throw {code:j.code||'server',message:j.error||'Sunucu hatası'};
    return j;
  }
  const docSnap=(col,id)=>{const d=store[col]&&store[col][id];return {id,exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}};};
  async function write(kind,col,id,data){
    if(!cred)throw {code:'auth',message:'Oturum kapalı. Yeniden giriş yapın.'};
    const before=store[col]&&store[col][id]?clone(store[col][id]):null;
    store[col]=store[col]||{};
    if(kind==='delete')delete store[col][id];else store[col][id]=kind==='update'&&before?Object.assign(clone(before),clone(data)):clone(data);
    notify();
    try{const j=await call({op:'write',kind,col,id,data:kind==='delete'?null:data,pin:cred.pin,teacherId:cred.teacherId});if(j.doc){store[col][id]=j.doc;notify();}}
    catch(e){if(before)store[col][id]=before;else delete store[col][id];notify();throw e;}
  }
  function docRef(col,id){
    return {id,path:col+'/'+id,get:async()=>docSnap(col,id),
      set:data=>write('set',col,id,data),update:data=>write('update',col,id,data),delete:()=>write('delete',col,id),
      onSnapshot:cb=>{const l={fire:()=>cb(docSnap(col,id))};listeners.add(l);Promise.resolve().then(()=>l.fire());return ()=>listeners.delete(l);}};
  }
  function colRef(col){
    return {path:col,doc:id=>docRef(col,id||uid()),add:async data=>{const r=docRef(col,uid());await r.set(data);return r;},
      onSnapshot:cb=>{const l={fire:()=>{const ids=Object.keys(store[col]||{}).sort();cb({docs:ids.map(id=>docSnap(col,id)),size:ids.length,empty:!ids.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}});}};listeners.add(l);Promise.resolve().then(()=>l.fire());return ()=>listeners.delete(l);}};
  }
  return {collection:colRef,doc:path=>{const i=path.lastIndexOf('/');return docRef(path.slice(0,i),path.slice(i+1));},
    async loadPublic(){const j=await call({op:'public'});store=j.data||{};notify();},
    async writeMany(items){if(!cred)throw {code:'auth',message:'Oturum kapalı. Yeniden giriş yapın.'};
      for(const it of items){store[it.col]=store[it.col]||{};store[it.col][it.id]=clone(it.data);}notify();
      for(let i=0;i<items.length;i+=80){const part=items.slice(i,i+80);
        let j;try{j=await call({op:'writeMany',items:part.map(it=>({kind:'set',col:it.col,id:it.id,data:it.data})),pin:cred.pin,teacherId:cred.teacherId});}catch(e){await this.refresh();throw e;}
        const bad=[];for(const r of (j.results||[])){if(r.ok&&r.doc){store[r.col]=store[r.col]||{};store[r.col][r.id]=r.doc;}else if(!r.ok)bad.push(r);}notify();
        if(bad.length){await this.refresh();throw {code:'server',message:`${bad.length} kayıt yazılamadı (${bad[0].error||'hata'})`};}}},
    async upload(o){if(!cred)throw {code:'auth',message:'Oturum kapalı. Yeniden giriş yapın.'};const j=await call(Object.assign({op:'upload',pin:cred.pin,teacherId:cred.teacherId},o));if(j.doc){store[o.col]=store[o.col]||{};store[o.col][o.id]=j.doc;notify();}return j;},
    async login(pin,teacherId){const j=await call({op:'login',pin,teacherId:teacherId||null});cred={pin,teacherId:teacherId||null};who=j.who;store=j.data||{};return j.who;},
    async refresh(){if(!cred)return;try{const j=await call({op:'load',pin:cred.pin,teacherId:cred.teacherId});who=j.who;store=j.data||{};notify();}catch(e){if(e.code==='auth'){cred=null;remoteLogout(true);}}},
    async importAll(data){if(!cred)throw {code:'auth',message:'Oturum kapalı.'};const j=await call({op:'import',data,pin:cred.pin,teacherId:null});await this.refresh();return j.counts;},
    async logout(){cred=null;who=null;await this.loadPublic().catch(()=>{});},
    notify,get who(){return who;}};
}

function subscribeAll(db){
  const cols=['teachers','schools','assignments','lessons','monthly','sets','candidates'];
  if(state.standalone||state.isOwner||state.remote)cols.push('contracts','payments','files');else{state.loaded.contracts=true;state.loaded.payments=true;state.loaded.files=true;}
  if(state.standalone||state.isOwner||state.remote)cols.push('agreements');else state.loaded.agreements=true;
  for(const c of cols){
    db.collection(c).onSnapshot(snap=>{const docs=snap.docs.map(d=>Object.assign({id:d.id},d.data()));state.raw=state.raw||{};state.raw[c]=docs;state[c]=SCOPE_COLS.includes(c)?scopeFilter(c,docs):docs;if(c==='assignments'||c==='lessons')rescope();if(c==='teachers'&&state.raw.teachers)state.teachers=scopeFilter('teachers',state.raw.teachers);state.loaded[c]=true;onData();},e=>{state.dbError=e;render();});
  }
  db.doc('settings/main').onSnapshot(s=>{state.settings=s.exists?s.data():null;state.loaded.settings=true;onData();},e=>{state.dbError=e;render();});
  try{db.doc('settings/sig').onSnapshot(s=>{state.sigAssets=s.exists?s.data():null;if(state.ready)render();},()=>{});}catch(e){}
}
async function boot(){
  if(REMOTE){
    state.remote=true;state.db=remoteDb(REMOTE);state.booted=true;render();
    try{await state.db.loadPublic();}catch(e){state.dbError=e;render();return;}
    const cred=lsGet('ttr.remote.cred');
    if(cred&&cred.pin){try{const who=await state.db.login(cred.pin,cred.teacherId);state.remoteWho=who;state.isOwner=who.role==='owner';}catch(e){lsSet('ttr.remote.cred',null);}}
    subscribeAll(state.db);
    setInterval(()=>{if(state.session&&!document.hidden&&$('#modal-root').hidden)state.db.refresh();},60000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.session)state.db.refresh();});
    return;
  }
  if(STANDALONE){
    state.standalone=true;state.db=localDb(SEED);state.booted=true;render();subscribeAll(state.db);return;
  }
  const [db,user,downloads,assets]=await Promise.all([use('db'),use('user'),use('downloads'),use('assets')]);
  state.db=db;state.user=user;state.downloads=downloads;state.assets=assets;
  if(user){try{state.isOwner=await user.isOwner();state.uid=await user.id();state.canWrite=await user.can('data.write');}catch(e){}}
  state.booted=true;
  render();
  if(!db)return;
  subscribeAll(db);
}

}

    if(!bar){bar=document.createElement('div');bar.className='hbar';bar.setAttribute('aria-hidden','true');bar.innerHTML='<div></div>';w.after(bar);

    case 'avail':return availView();

    case 'finance':return financeAllowed()?financeView():(state.standalone?financeLockView():'<p class="empty">Bu bölüm yalnızca hesap sahibine açıktır.</p>');
    case 'bsa':return financeAllowed()?bsaView():(state.standalone?financeLockView():'<p class="empty">Bu bölüm yalnızca hesap sahibine açıktır.</p>');

}
function lessonRow(l,o){
  IDX.lessons[l.id]=l;o=o||{};
  const st=lessonStatus(l);
  const locked=o.locked;
  const acts=[];
  if(!locked){
    if(st==='pending'){acts.push(btn('done',{id:l.id},'✓ Derse girdim','primary sm'));acts.push(btn('cancel',{id:l.id},'Yapılmadı','ghost sm'));}
    else if(st==='upcoming'){if(o.admin)acts.push(btn('cancel',{id:l.id},'İptal et','ghost sm'));}
    else{acts.push(btn('done',{id:l.id},st==='cancelled'?'Düzenle / geri al':'Düzenle','ghost sm'));}
    if(o.admin&&needsVerify(l))acts.push(btn('verifyLesson',{id:l.id},'Onayla','primary sm'));
    if(o.admin&&!l.virtual)acts.push(btn('resetLesson',{id:l.id},l.extra?'Sil':'Sıfırla','ghost sm'));
    if(!o.admin&&l.extra)acts.push(btn('resetLesson',{id:l.id},'Sil','ghost sm'));
  }
  if(lessonStatus(l)==='cancelled'&&canMakeup(l,!!o.admin))acts.push(btn('makeup',{id:l.id},'↺ Telafi ekle','ghost sm'));
  const hrs=st==='done'?`${fmtNum(l.hours)} ders`:st==='cancelled'?'—':`${fmtNum(l.plannedHours||l.hours)} ders`;
  return `<div class="lrow ${st}">
    <div class="l-when">${o.showDate!==false?`${fmtDate(l.date)} ${DAYS_S[weekdayOf(l.date)-1]}<br>`:''}${l.start?esc(l.start):''}</div>
    <div class="l-main"><b>${schoolLink(l.schoolId)}</b>${o.showTeacher?` <span class="muted">· ${teacherLink(l.teacherId)}</span>`:''}${l.substituteFor?' '+chip('accent',esc(tName(l.substituteFor))+' yerine'):l.makeupFor?' '+chip('info','Telafi · '+fmtDate(l.makeupDate)+' yerine'):l.extra?' '+chip('info','Ek ders'):''}${l.replacedBy?' '+chip('warn','Yerine '+esc(tName(l.replacedBy))+' girdi'):''}${l.makeupBy?' '+chip('ok','Telafi edildi → '+fmtDate(l.makeupOn)):''}${l.payMonth&&l.payMonth!==monthKeyOf(l.date)?' '+chip('','Ödeme: '+monthLabel(l.payMonth)):''}${l.trial?' '+chip('warn','Deneme dersi'):''}${lessonStatus(l)==='done'&&isDayBased(l.schoolId)?' '+chip(dayTypeOf(l)==='tam'?'ok':'info',DAYTYPE_LBL[dayTypeOf(l)]):''}${l.note?`<div class="muted small">${esc(l.note)}</div>`:''}</div>
    <div class="l-hrs">${hrs}</div>
    <div class="l-st">${statusChip(l)}</div>
    <div class="l-act">${acts.join('')}</div>
  </div>`;
}

function weekGrid(ws){
  const days=[0,1,2,3,4,5,6].map(i=>addDays(ws,i));
  const ls=lessonsIn(days[0],days[6]);
  const showWe=ls.some(l=>weekdayOf(l.date)>=6);
  const cols=showWe?7:5;
  const teachers=activeTeachers().filter(t=>ls.some(l=>l.teacherId===t.id));
  if(!teachers.length)return '<p class="empty">Bu hafta planlı ders yok. Haftalık programdan ders günü ekleyin.</p>';
  const t=todayISO();
  const head=days.slice(0,cols).map(d=>`<th class="${d===t?'today':''}">${DAYS_S[weekdayOf(d)-1]} ${fmtDate(d)}</th>`).join('');
  const body=teachers.map(tc=>`<tr><td>${teacherLink(tc.id)}</td>${days.slice(0,cols).map(d=>{const cell=ls.filter(l=>l.teacherId===tc.id&&l.date===d);return `<td>${cell.map(l=>{IDX.lessons[l.id]=l;const st=lessonStatus(l);return `<span class="cell-l ${st}"><b>${esc(sName(l.schoolId))}</b><span class="mono">${l.start?esc(l.start)+' · ':''}${fmtNum(st==='done'?l.hours:(l.plannedHours||l.hours))} ders${l.extra?' · ek':''}</span></span>`;}).join('')}</td>`;}).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table class="tbl wk"><thead><tr><th>Öğretmen</th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function lessonsView(){

    return `<tr class="${l.date===tdy?'today':''}"><td class="mono">${fmtDate(l.date)} <span class="muted">${DAYS_S[weekdayOf(l.date)-1]}</span></td><td>${teacherLink(l.teacherId)}</td><td>${schoolLink(l.schoolId)}${l.substituteFor?' '+chip('accent',esc(tName(l.substituteFor))+' yerine'):l.makeupFor?' '+chip('info','Telafi · '+fmtDate(l.makeupDate)+' yerine'):l.extra?' '+chip('info','Ek'):''}${l.replacedBy?' '+chip('warn','Yerine '+esc(tName(l.replacedBy))+' girdi'):''}${l.makeupBy?' '+chip('ok','Telafi edildi → '+fmtDate(l.makeupOn)):''}${l.payMonth&&l.payMonth!==monthKeyOf(l.date)?' '+chip('','Ödeme: '+monthLabel(l.payMonth)):''}${l.trial?' '+chip('warn','Deneme dersi'):''}</td><td class="mono">${esc(l.start||'')}</td><td class="num">${fmtNum(l.plannedHours||'')}</td><td class="num">${st==='done'?fmtNum(l.hours):''}</td><td>${statusChip(l)}${l.note?`<div class="muted small">${esc(l.note)}</div>`:''}${l.confirmedBy?`<div class="muted small">${esc(l.confirmedBy)} · ${fmtStamp(l.confirmedAt)}</div>`:''}</td><td class="act">${acts.join('')}</td></tr>`;}).join('');

const PRICE_MODELS=[['kademeli','Yıllık program (kademeli, taban korumalı)'],['ogrenci','Öğrenci başı'],['saat','Ders saati başı'],['gunluk','Günlük (eğitmen başı)'],['aylik','Aylık sabit'],['donemlik','Dönemlik sabit']];
const teacherDaysPerWeek=id=>new Set(liveAssignments().filter(a=>a.schoolId===id).map(a=>a.teacherId+'_'+a.weekday)).size;
const PERIODS=[['aylik','aylık'],['donemlik','dönemlik'],['yillik','yıllık']];
const MONTHS_IN={aylik:1,donemlik:4.5,yillik:9};
const modelLabel=m=>(PRICE_MODELS.find(x=>x[0]===m)||PRICE_MODELS[0])[1];
const periodLabel=p=>(PERIODS.find(x=>x[0]===p)||PERIODS[0])[1];
const contractFor=id=>state.contracts.find(c=>c.schoolId===id);
const contractStudents=c=>{const cl=Array.isArray(c.classes)?c.classes:[];const n=cl.reduce((a,x)=>a+(Number(x.students)||0),0);return n||Number(c.students)||0;};

function contractAmount(c){const r=contractAmountBase(c);const ex=(c.extraPrograms||[]).filter(x=>Number(x.perStudentMonthly)>0&&Number(x.students)>0);if(!ex.length)return r;
  const add=ex.reduce((a,x)=>a+Number(x.perStudentMonthly)*Number(x.students),0);
  return Object.assign({},r,{label:r.label+ex.map(x=>` + ${esc(x.name)}: ${fmtNum(x.students)} öğrenci × ${fmtTL(x.perStudentMonthly)}/ay`).join(''),monthly:r.monthly+add,perPeriod:r.perLabel==='aylık'||r.perLabel===periodLabel('aylik')?r.perPeriod+add:r.perPeriod,extraMonthly:add});}
function contractAmountBase(c){
  const price=Number(c.price)||0;const st=contractStudents(c);
  if(c.model==='ogrenci'){const per=c.period||'aylik';const tot=st*price;return {label:`${fmtNum(st)} öğrenci × ${fmtTL(price)} · ${periodLabel(per)}`,perPeriod:tot,monthly:tot/MONTHS_IN[per],perLabel:periodLabel(per)};}

  return {label:`${fmtTL(price)} / ay`,perPeriod:price,monthly:price,perLabel:'aylık'};

function realizedMonth(c,ym){
  const [f,t]=monthRange(ym);const ls=lessonsIn(f,t).filter(l=>l.schoolId===c.schoolId&&lessonStatus(l)==='done'&&!l.trial&&!(l.extra&&!l.approved));

  return {hours,teacherCost,tdays,fullDays:fullD,halfDays:tdays-fullD,revenue:c.model==='saat'?hours*(Number(c.price)||0):c.model==='gunluk'?dunits*(Number(c.price)||0):null};
}

function kademeliMonthly(n,c){
  const min=Number(c&&c.minFee)||30000;n=Number(n)||0;if(!n)return 0;
  let v;if(n<=20)v=n*2000;else if(n<=26)v=40000;else if(n<=50)v=n*1500;else if(n<=60)v=75000;else if(n<=100)v=n*1250;else if(n<=125)v=125000;else v=n*1000;

function bsaExpected(c,ym){
  const e=ledgerOf(c,ym)||{};
  if(e.expected!=null&&e.expected!=='')return Number(e.expected)||0;
  if(c.model==='gunluk'&&Number(e.teacherDays))return Number(e.teacherDays)*(Number(c.price)||0);

function bsaMonth(c,ym){
  const e=ledgerOf(c,ym)||{};const expected=bsaExpected(c,ym);const collected=Number(e.collected)||0;const sent=Number(e.sent)||0;
  const ttDue=expected*ttShareOf(c)/100;
  const cSt=collected<=0?['warn','Bekliyor']:collected+0.5<expected?['info','Kısmi tahsil']:['ok','Tahsil edildi'];
  const sSt=sent<=0?(collected>0?['warn','Gönderilmedi']:['', '—']):sent+0.5<ttDue?['info','Kısmen gönderildi']:['ok','Gönderildi'];
  return {e,expected,collected,remaining:Math.max(0,expected-collected),ttDue,sent,ttRemaining:Math.max(0,ttDue-sent),cSt,sSt};
}

const AGR_CFG_DEFAULT={company:'TT Robotics',address:'',taxNo:'',contact:'',penalty:100000,court:'İstanbul Anadolu',periodStart:'2026-09-01',periodEnd:'2027-06-30',notifyHours:48,payDay:10};
const agrCfg=()=>Object.assign({},AGR_CFG_DEFAULT,(S().contract)||{});

const fmtDMY=s=>{if(!s)return '…/…/20…';const [y,m,d]=String(s).slice(0,10).split('-');return `${d}.${m}.${y}`;};
function agrHash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(16);}
function agrTeacherSchools(tid){
  const raw=(state.raw&&state.raw.assignments)||state.assignments;
  const m={};for(const a of raw){if(a.teacherId!==tid||a.active===false)continue;(m[a.schoolId]=m[a.schoolId]||[]).push(a);}

/* Ek-1 satırları: yalnızca öğretmenin kendi ücreti — okul ücreti, marj ve başka öğretmen ücreti asla yazılmaz */
function agrRows(tid){
  const rows=[];const bySchool=agrTeacherSchools(tid);const schools=(state.raw&&state.raw.schools)||state.schools;
  const sObj=id=>schools.find(s=>s.id===id)||{};
  const ids=new Set(Object.keys(bySchool));
  for(const c of (state.contracts||[]))for(const d of (c.teacherDeals||[]))if(d.teacherId===tid)ids.add(c.schoolId||c.id);
  for(const s of schools)for(const f of (s.teacherPay||[]))if(f.teacherId===tid)ids.add(s.id);
  let insured=false;
  for(const sid of ids){
    const s=sObj(sid);const as=bySchool[sid]||[];
    const c=(state.contracts||[]).find(x=>(x.schoolId||x.id)===sid)||{};
    const deals=(c.teacherDeals||[]).filter(d=>d.teacherId===tid);
    const fixed=(s.teacherPay||[]).find(f=>f.teacherId===tid);
    const days=[...new Set(as.map(a=>Number(a.weekday)||0).filter(Boolean))].sort();
    const lessonsWk=as.reduce((t,a)=>t+(Number(a.hours)||0),0);
    const prog=[...new Set(as.map(a=>a.program).filter(Boolean))].join(', ');
    const base={school:s.name||sName(sid),days:days.map(dayName).join(', ')||'Programa göre',lessons:'',program:prog,terms:[]};
    const push=(pay,terms)=>rows.push(Object.assign({},base,{pay,terms:(terms||[]).filter(Boolean)}));
    const absTerms=d=>{const t=[];
      if(d.absenceDeduction){const p=Object.entries(d.absenceDeduction).map(([w,v])=>`${dayName(Number(w))} ${tlx(v)}`).join(', ');t.push(`Gelinmeyen gün kesintisi: ${p}.`);}
      if(d.absenceDeductionPerDay)t.push(`Gelinmeyen her ders günü için ${tlx(d.absenceDeductionPerDay)} kesilir.`);
      if(d.renegotiateBelowStudents)t.push(`Öğrenci sayısı ${d.renegotiateBelowStudents}'ın altına düşerse ücret taraflarca yeniden görüşülür.`);
      if(false)t.push(`Ücret haftada ${d.daysPerWeek?d.daysPerWeek+' gün':''}${d.daysPerWeek&&d.lessonsPerWeek?', ':''}${d.lessonsPerWeek?'yaklaşık '+d.lessonsPerWeek+' ders':''} için belirlenmiştir.`);
      return t;};
    if(deals.length){
      for(const d of deals){
        if(d.plusInsurance)insured=true;
        const dd=(d.days&&d.days.length)?d.days.map(dayName).join(', '):base.days;
        let pay='';const t=absTerms(d);
        if(d.model==='ders'){pay=`Ders başı (40 dk) ${tlx(d.perLesson)}`;
          if(d.sharedWith)t.push(`Bu derslere ${esc(tName(d.sharedWith))} ile birlikte girilir; ders başı ücret iki eğitmen arasında eşit paylaştırılmıştır.`);}
        else if(d.model==='gunluk'){if(d.perDayByStudents){pay='Gidiş başı sabit ücret, gruptaki öğrenci sayısına göre: '+Object.entries(d.perDayByStudents).sort((a,b)=>b[0]-a[0]).map(([n,v])=>`${n} öğrenci ${tlx(v)}`).join(' · ');}
          else pay=`Gidiş (ders günü) başı sabit ${tlx(d.perDay)}`;
          t.push('Ücret fiilen gidilen her ders günü için ödenir; 5 haftalı aylarda gidilen gün sayısı kadar ödenir.');}
        else if(d.model==='haftalik'){pay=`Haftalık ${tlx(d.perWeek)} · ayda en fazla ${d.maxWeeks||4} hafta (${tlx(d.perWeek*(d.maxWeeks||4))})`;t.push('Ay içinde ders verilen (okulun açık olduğu) hafta sayısı kadar ödenir; örneğin 3 hafta için 3 haftalık ücret.');}
        else if(d.model==='aylik'){pay=`Aylık sabit ${tlx(d.monthly)}`;}
        if(d.plusInsurance)t.push('Sosyal güvenlik primleri mevzuata göre ayrıca yatırılır.');
        rows.push(Object.assign({},base,{days:dd,pay,terms:t},d.program?{program:d.program}:{},{}));
      }
    }else if(fixed){
      const note=String(fixed.note||'');if(/sigorta/i.test(note))insured=true;
      const t=[];if(/kesinti/i.test(note)){const m=note.match(/([\d.]+)\s*TL\s*kesinti/i);if(m)t.push(`Gelinmeyen her ders günü için ${m[1]} TL kesilir.`);}
      if(/koordinasyon/i.test(note))t.push('Koordinasyon görevleri bu ücrete dahildir.');
      push(`Aylık sabit ${tlx(fixed.monthly)}`,t);
    }else if(Number(s.payRate)>0){
      push(`Ders başı (40 dk) ${tlx(s.payRate)}`);
    }else{
      const ex=as.map(a=>Number(a.rate)).find(v=>v>0);
      if(ex)push(`Ders başı (40 dk) ${tlx(ex)}`);
      else{const tr=tariff()||TARIFF_DEFAULT;const tiers=tr.tiers.slice().sort((a,b)=>a.min-b.min);push('Kademeli ders başı ücret: '+tiers.map((x,i)=>{const nx=tiers[i+1];return `günde ${x.min}${nx?'–'+(nx.min-1):'+'} ders ${tlx(x.rate)}`;}).join(' · '));}
    }
    if(c.collectedByTeacher){const r=rows[rows.length-1];r.terms.push('Bu okulda veliden alınan ücretleri EĞİTMEN toplar. Toplanan tutarın tamamı, öğrenci listesi ve ödeme dökümüyle birlikte en geç 5 iş günü içinde TT ROBOTICS\'e teslim edilir. Toplanan tutarlar EĞİTMEN\'in ücretinden mahsup edilemez ve emanet niteliğindedir.');}
  }
  return {rows,insured};
}

  A('HUKUKİ NİTELİK',(ins?[`İşbu sözleşme 4857 sayılı İş Kanunu'nun 13. maddesi anlamında kısmi süreli iş sözleşmesidir. ${O}, ${W} tarafından sosyal güvenlik mevzuatına göre sigortalı olarak bildirilir.`,

    `${O}, kendi gelirine ilişkin vergi ve diğer yasal yükümlülüklerden kendisi sorumludur.`]).concat([

  A('ÖĞRENCİ KAYDI VE AYLIK BİLDİRİM',[`${O}, Program'a kayıtlı öğrencileri (drone ve VEX IQ grupları ayrı ayrı olmak üzere) her ay TT Robotics paneline veya ${W}${ins?"'in":"'un"} belirlediği ortak tabloya eksiksiz girer.`,
    `${O}, her ayın son gününe kadar o aya ait aylık bildirimi tamamlar. Bildirim; program ve grup bazında öğrenci sayısını, her öğrenciden alınan ücreti, tahsil edilen ve edilemeyen tutarları, yapılan giderleri ve yardımcı eğitmen ödemelerini içerir.`,
    `Bildirimin doğru, eksiksiz ve zamanında yapılmasından ${O} sorumludur. Eksik ya da gerçeğe aykırı bildirim işbu sözleşmeye esaslı aykırılık sayılır.`]);
  A('TAHSİLAT',[`Program ücretlerini velilerden ${O} tahsil eder. ${O}, her tahsilatı aynı ay içinde panele işler ve veliye tahsilatı gösteren bir belge (dekont, makbuz veya yazılı teyit) verir.`,

    `Tahsil edilemeyen ücretler bildirimde ayrıca gösterilir; taraflar tahsilat için birlikte karar verir.`]);
  A('ORTAK GİDERLER',[`Program için gerekli set ve ekipman alımları, yarışma katılım ücretleri, yarışmaya ilişkin ulaşım ve benzeri giderler ile ${O}${ins?"'e":"'na"} yardımcı olan eğitmenlere ödenen ücretler <b>ortak gider</b> sayılır ve paylaşımdan önce toplam gelirden düşülür.`,
    `Ortak gider niteliğindeki her harcama, yapılmadan önce ${W}${ins?"'in":"'un"} yazılı onayına (panel, e-posta veya WhatsApp yazışması yeterlidir) sunulur. Onaysız harcama ortak gider sayılmaz ve harcamayı yapan tarafça karşılanır.`,
    `Her ortak gider fatura, fiş veya dekontla belgelenir ve belgeler panele yüklenir ya da ${W}${ins?"'e":"'a"} iletilir. Belgelendirilmeyen gider ortak gider sayılmaz.`,
    `${O}${ins?"'in":"'nın"} Program'da görevlendirdiği yardımcı eğitmenler ${W}${ins?"'in":"'un"} onayıyla çalışır. Yardımcı eğitmenlerin ücreti, işbu maddeye göre ortak giderdir; yardımcı eğitmenlerin seçimi, denetimi ve ödemelerinin zamanında yapılmasından ${O} sorumludur.`]);
  A('VERGİLER',[`Program geliri için fatura kesilmesi ya da tahsilatın ${W}${ins?"'in":"'un"} veya Tolga Topçubaşı'nın banka hesabına (IBAN) yatırılması hâlinde, bu gelir nedeniyle doğan KDV ile gelir veya kurumlar vergisi gibi vergiler, paylaşımdan önce toplam gelirden düşülür.`,

    `${O}'in payı brüt ücrettir. Bu paydan yapılması gereken yasal kesintiler (SGK ve işsizlik sigortası işçi payı, gelir vergisi, damga vergisi) ${W} tarafından bordroda hesaplanır ve ${O}'in payından düşülür.`]:[]));
  A('GELİRİN PAYLAŞIMI',[`Her ay için <b>net gelir</b> şöyle hesaplanır: o ay tahsil edilen toplam Program geliri − ortak giderler (set, ekipman, yarışma ve yardımcı eğitmen ücretleri) − 7. maddedeki vergiler.`,
    `Net gelir taraflar arasında <b>%50 ${W}</b> ve <b>%50 ${O}</b> olarak paylaşılır.`,
    `Bir ayda ortak giderler o ayın gelirini aşarsa aşan tutar sonraki ayların gelirinden düşülür; taraflar aksini yazılı olarak kararlaştırmadıkça hiçbir taraf diğerinden doğrudan ödeme talep etmez.`]);
  A('ÖDEME',[`${O}, her ayın sonunda (en geç takip eden ayın 5. günü) ${W} payını${ins?', 7. maddedeki işveren maliyetleri ve kendi payından yapılacak yasal kesintilerle birlikte,':''} Tolga Topçubaşı'nın bildirdiği banka hesabına (IBAN) yatırır ve aynı gün aylık hesap dökümünü panele girer.${ins?` ${O}'in elinde kalan pay, o ayın ücreti olarak bordroya yansıtılır.`:''}`,
    `Tahsilatın doğrudan ${W} hesabına yatırıldığı durumlarda ${W}, ${O}${ins?"'in":"'nın"} payını hesap dökümünün kesinleşmesinden sonra 5 gün içinde ${O}${ins?"'in":"'nın"} IBAN'ına öder.`,
    `Süresinde yatırılmayan tutar için ${W} yazılı olarak ihtarda bulunur; ihtara rağmen 7 gün içinde ödeme yapılmaması işbu sözleşmeye esaslı aykırılık sayılır ve ${W}${ins?"'e":"'a"} sözleşmeyi derhal feshetme hakkı verir. Kanuni faiz ve diğer haklar saklıdır.`]);
  A('KAYIT, BELGE VE DENETİM',[`${O}, Program'a ilişkin tüm öğrenci, tahsilat ve gider kayıtlarını en az 2 yıl saklar.`,

  A('SET VE EKİPMAN',[`${W}${ins?"'e":"'a"} ait olup Program'da kullanılan set ve ekipman ${W}${ins?"'in":"'un"} mülkiyetinde kalır; ${O} bu ekipmanı özenle kullanmak, korumak ve istendiğinde eksiksiz iade etmekle yükümlüdür.`,
    `Ortak gider olarak alınan set ve ekipman, sözleşme süresince Program'da kullanılır. Sözleşme sona erdiğinde taraflar bu ekipmanı eşit olarak paylaşır ya da bir taraf diğerinin payını o günkü değeri üzerinden satın alır; anlaşamazlarsa ekipman satılarak bedeli eşit paylaşılır.`]);
  A('MARKA, MÜFREDAT VE KURUM İLİŞKİSİ',[`"TT Robotics" adı, logosu, müfredatı ve eğitim materyalleri ${W}${ins?"'e":"'a"} aittir. ${O} bunları yalnızca işbu sözleşme süresince ve Program kapsamında kullanabilir.`,
    `Program'ın yürütüldüğü kurum ile ilişki ${W} adına yürütülür. ${O}, kurum yönetimiyle ücret, süre veya kapsam konusunda ${W}${ins?"'in":"'un"} bilgisi ve onayı olmadan anlaşma yapamaz.`]);
  A('REKABET VE ÖĞRENCİ YÖNLENDİRME',[`${O}, sözleşme süresince ve sona ermesinden itibaren 1 (bir) yıl boyunca${ins?' (6098 sayılı TBK m.444-447 çerçevesinde)':''}, Program öğrencilerini veya velilerini ${W} dışındaki bir kuruma ya da kendi adına açılacak bir programa yönlendiremez; Program'ın yürütüldüğü kurumda ${W}${ins?"'in":"'un"} yazılı onayı olmadan benzer bir eğitim programı yürütemez.`]);
  A('GİZLİLİK VE KİŞİSEL VERİLER',[`Taraflar, öğrenci ve veli bilgilerini, ücretleri ve işbu sözleşmenin şartlarını gizli tutar; yalnızca Program amacıyla kullanır.`,

    ins?`Deneme süresinden sonra taraflar, 4857 sayılı İş Kanunu'nun 17. maddesindeki bildirim sürelerine uyarak sözleşmeyi feshedebilir; Kanun'un 24. ve 25. maddelerindeki hâllerde (gerçeğe aykırı bildirim, tahsil edilen paranın süresinde yatırılmaması dahil) sözleşme derhal feshedilebilir.`:`Taraflardan her biri 30 (otuz) gün önceden yazılı bildirimde bulunarak sözleşmeyi feshedebilir. Esaslı aykırılık hâlinde diğer taraf sözleşmeyi derhal feshedebilir.`,
    `Fesih hâlinde fesih tarihine kadarki gelir ve giderler işbu sözleşmeye göre hesaplanır ve 15 gün içinde ödenir; ücreti tahsil edilmiş dönemin eğitimi taraflarca tamamlanır ya da ücret iadesi ortak gider olarak düşülür.`]);
  A('UYUŞMAZLIKLAR',[ins?`İşbu sözleşmeden doğan uyuşmazlıklarda 7036 sayılı Kanun uyarınca dava şartı olarak arabuluculuğa başvurulur; anlaşma sağlanamazsa ${esc(cfg.court)} İş Mahkemeleri ve İcra Daireleri yetkilidir. Taraflar, panel kayıtlarının ve yazışmaların delil niteliğini kabul eder.`:`İşbu sözleşmeden doğan uyuşmazlıklarda ${esc(cfg.court)} Mahkemeleri ve İcra Daireleri yetkilidir. Taraflar, panel kayıtlarının ve yazışmaların delil niteliğini kabul eder.`]);
  A('SON HÜKÜMLER',[`İşbu sözleşmede yapılacak değişiklikler yazılı olarak yapılır; panel üzerinden gönderilip ${O} tarafından onaylanan güncellemeler yazılı değişiklik sayılır.`,
    `Sözleşmenin herhangi bir hükmünün geçersiz sayılması diğer hükümleri etkilemez.`]);
  const ek1=`<h2 class="pb">EK-1 — GELİR PAYLAŞIMI HESAP ÖRNEĞİ</h2>

function agrBody(tid,typeA){

  A('TARAFLAR',[`<b>${W}:</b> ${esc(cfg.company)}${cfg.address?' · '+esc(cfg.address):''}${cfg.taxNo?' · Vergi D./No: '+esc(cfg.taxNo):''}${cfg.contact?' · '+esc(cfg.contact):''}`,
    `<b>EĞİTMEN:</b> {{AD}} · T.C. Kimlik No: {{TC}} · Adres: {{ADRES}} · Telefon: {{TEL}} · E-posta: {{EPOSTA}} · IBAN: {{IBAN}}`]);
  A('SÖZLEŞMENİN KONUSU',[`İşbu sözleşmenin konusu; EĞİTMEN'in, ${W} tarafından belirlenen okul ve kurumlarda robotik, kodlama ve teknoloji eğitimi vermesi işinin esasları ile tarafların bu kapsamdaki hak ve yükümlülüklerinin ve EĞİTMEN'e yapılacak ödemelerin düzenlenmesidir.`]);
  A('SÖZLEŞMENİN TÜRÜ VE SÜRESİ',(typeA?[`İşbu sözleşme 4857 sayılı İş Kanunu'nun 13. maddesi anlamında kısmi süreli iş sözleşmesidir.`]:[])
    .concat(typeA?[`<b>Deneme süresi:</b> 4857 sayılı İş Kanunu'nun 15. maddesi uyarınca EĞİTMEN'in sigortalı olarak işe başladığı (SGK işe giriş bildiriminin yapıldığı) tarihten itibaren ilk 2 (iki) ay deneme süresidir (Kanun'un izin verdiği en uzun süre). Bu süre içinde taraflardan her biri, gerekçe göstermeksizin, bildirim süresine uymaksızın ve ihbar ya da kıdem tazminatı ödemeksizin sözleşmeyi feshedebilir. Bu durumda EĞİTMEN yalnızca fiilen çalıştığı süreye ait ücret ve diğer yasal haklarını alır; başkaca bir tazminat, ücret veya işe iade talebinde bulunamaz.`]:[]).concat([`Sözleşme ${fmtDMY(cfg.periodStart)} tarihinde yürürlüğe girer ve ${fmtDMY(cfg.periodEnd)} tarihinde (eğitim-öğretim yılı sonunda) kendiliğinden sona erer. Taraflar yeni dönem için yazılı olarak ya da panel üzerinden yeniden anlaşabilir.`]));
  A('ÇALIŞMA YERİ VE DERS PROGRAMI',[`EĞİTMEN, EK-1'de belirtilen okul ve kurumlarda ders verir. Görev yeri ve program, ${W}'in bildirimiyle dönem içinde değiştirilebilir; ücrete etkisi olan değişiklikler EK-1 güncellenerek panel üzerinden EĞİTMEN'in onayına sunulur.`,
    `Bir ders saati 40 (kırk) dakikadır. 90 dakikalık bir blok 2 ders sayılır.`,
    `EĞİTMEN, ders programını (gün, saat, sınıf, öğrenci sayısı) TT Robotics paneline doğru ve eksiksiz girer; programda değişiklik olduğunda paneli günceller ve ${W}'e bildirir.`,
    `EĞİTMEN, ders başlangıcından en az 15 dakika önce görev yerinde hazır bulunur. Ders öncesi hazırlık, set kurulumu ve toplama süreleri ders ücretine dahildir.`]);
  A('ÜCRET',[`EĞİTMEN'e ödenecek ücret, okul/kurum bazında işbu sözleşmenin ayrılmaz parçası olan <b>EK-1 Ücret Çizelgesi</b>'nde gösterilmiştir. EK-1'de yazılı tutarlar dışında ${W}'den hiçbir ad altında ek ödeme (yol, yemek, hazırlık, bekleme, prim vb.) talep edilemez; bu giderler ücrete dahildir.`,
    `Ders başı ücretlerde ödeme, fiilen girilen ve onaylanan ders sayısı üzerinden yapılır. Gün başı ücretlerde fiilen gidilen ders günü, haftalık ücretlerde ders verilen hafta, aylık sabit ücretlerde ilgili ay esas alınır.`,
    `${W} bir okulda ders vermek üzere başka bir eğitmeni EĞİTMEN'in yerine görevlendirirse o dersin ücreti fiilen derse giren eğitmene ödenir.`,
    `Deneme dersleri EK-1'deki ücretlendirmenin dışındadır. EĞİTMEN girdiği deneme derslerini panelde "Deneme dersi" olarak işaretler; bu derslerin ücretlendirmesi ${W} tarafından ayrıca belirlenir ve ayrı bir süreçle yapılır.`,
    `Ücret tutarları ve ödeme koşulları gizlidir; EĞİTMEN bunları okul yönetimi, veliler, öğrenciler ve diğer eğitmenlerle paylaşamaz.`]);

    `Primlerin işveren hissesi ${W} tarafından karşılanır ve EĞİTMEN'in ücretinden kesilmez.`]);
