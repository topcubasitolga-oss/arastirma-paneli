    `<b>Önceden bildirim:</b> EĞİTMEN, derse gelemeyeceğini en az <b>${nH} saat önceden</b> ${W}'e (telefon/WhatsApp ile) ve panel üzerinden bildirir; bildirimde gelinemeyecek gün, ders ve gerekçe belirtilir. Ani hastalık ve mücbir sebep hâllerinde bildirim öğrenildiği anda yapılır ve belgelendirilir (sağlık raporu vb.).`,
    `<b>Girilmeyen ders ücreti:</b> Fiilen girilmeyen ders için ders ücreti ödenmez. Bu kural mazeretli ve mazeretsiz devamsızlık için aynıdır.`,
    `<b>Kesintinin hesaplanması:</b> (a) Ders başı ücretlerde girilmeyen ders sayısı kadar ders ücreti ödenmez. (b) Gün başı sabit ücretlerde gidilmeyen gün için o günün ücreti ödenmez. (c) Haftalık ücretlerde ders verilmeyen hafta için haftalık ücret ödenmez; hafta içinde kısmi devamsızlıkta EK-1'deki gün kesintisi uygulanır. (d) Aylık sabit ücretlerde gelinmeyen her ders günü için EK-1'de yazılı gün kesintisi uygulanır; EK-1'de tutar yazılı değilse kesinti, aylık ücretin o ay planlanan ders günü sayısına bölünmesiyle bulunur.`,
    `<b>Kısmi katılım:</b> Ders süresinin yarısından fazlasına katılmayan EĞİTMEN o derse girmemiş sayılır. 15 dakikayı aşan gecikmeler ${W}'e bildirilir; tekrarlayan gecikmeler bildirimsiz devamsızlık hükmündedir.`,
    `<b>Okul kaynaklı iptal ve tatiller:</b> Resmî tatil, ara tatil, okul kaynaklı iptal veya okulun kapalı olduğu günlerde ders yapılmadığı için ücret tahakkuk etmez. Okulun ödeme yaptığı haftalarla sınırlı ücretlerde (EK-1) ödenen hafta sayısı esas alınır.`,
    `<b>Telafi:</b> EĞİTMEN kaynaklı iptal edilen dersler, okul ve ${W} ile planlanan bir tarihte telafi edilebilir; telafi dersi yapıldığında o dersin ücreti bir kez ödenir.`,
    `<b>Bildirimsiz devamsızlık:</b> Önceden bildirilmeyen her devamsızlık kayda geçirilir. Bir eğitim-öğretim yılında 2 (iki) kez bildirimsiz derse gelinmemesi ya da art arda 2 ders gününe gelinmemesi, ${W} bakımından sözleşmenin derhal feshi için haklı sebep sayılır.`,
    `Kesintiler, ilgili ayın ücret hesabında panelde ayrı satır olarak gösterilir; EĞİTMEN itirazını ödeme tarihinden önce yazılı olarak yapar.`]);
  A('ZİMMETLİ EKİPMAN (ROBOTİK SETLER)',[`${W}'e ait robotik setler ve eğitim ekipmanı EĞİTMEN'e ve/veya görev yaptığı okula panel kaydıyla teslim edilir; setler ${W}'in mülkiyetindedir.`,
    `EĞİTMEN, zimmetindeki ekipmanın korunmasından, düzenli sayımından ve amacına uygun kullanımından sorumludur; her ders sonunda parça sayımı yapar; eksik ya da hasarı en geç 24 saat içinde panele kaydeder ve ${W}'e bildirir. Süresinde bildirilmeyen eksiklikler, tespit anında EĞİTMEN'in zimmetinde sayılır.`,
    `Ekipman, ${W}'in yazılı izni olmadan görev yerinden çıkarılamaz, üçüncü kişilere kullandırılamaz ve devredilemez. Sözleşme sona erdiğinde zimmetteki tüm ekipman en geç 3 iş günü içinde eksiksiz teslim edilir.`,
    `<b>Kayıp ve eksik parça:</b> Zimmetteki setlerden kaybolan, eksilen ya da EĞİTMEN'in kusuruyla hasar gören parçaların bedeli EĞİTMEN'e aittir. Bedel, parçanın güncel yenileme (satın alma) fiyatı üzerinden ${W} tarafından belirlenir ve panelde set kaydına işlenir.`,
    `<b>Bedelin ödenmesi:</b> ${typeA?`EĞİTMEN, kayıp ve eksik parça bedelinin ücretinden kesilmesine işbu sözleşmeyle muvafakat eder; kesinti her olayda yazılı olarak bildirilir. Bir ayda yapılacak kesinti, EĞİTMEN'in o ayki net ücretinin dörtte birini aşamaz; kalan tutar sonraki aylara aynı sınırla yansıtılır.`:`Kayıp ve eksik parça bedeli, EĞİTMEN'in o ayki hak edişinden (ödemesinden) kesilir; tutarın bir aylık ödemeyi aşması hâlinde kalan kısım sonraki ödemelerden kesilir. Sözleşme sona ererken teslim edilmeyen ekipmanın bedeli son ödemeden düşülür.`}`,
    `Olağan kullanımdan doğan aşınma, üretim hatası ve EĞİTMEN'in kusuru bulunmayan hâller (okulda kilitli dolapta bulunurken yaşanan hırsızlık, yangın, su baskını vb.) ile ekipmanın EĞİTMEN'in zimmetinde bulunmadığı sürelerdeki kayıplar EĞİTMEN'e yüklenmez. Bu hâllerin de en geç 24 saat içinde bildirilmesi gerekir; bildirilmeyen kayıplar EĞİTMEN'in sorumluluğundadır.`]);
  A('EĞİTMEN\'İN YÜKÜMLÜLÜKLERİ',[`EĞİTMEN, ${W}'in belirlediği müfredata uygun ders verir, görev yaptığı okulun kurallarına uyar ve öğrenci güvenliğini her an gözetir; öğrencileri ders süresince gözetimsiz bırakmaz.`,
    `EĞİTMEN, okul yönetimi, veliler veya öğrencilerle ücret, sözleşme ve ${W}'in ticari koşulları hakkında görüşme yapamaz; bu konudaki talepleri ${W}'e yönlendirir.`,
    `EĞİTMEN, ${W}'in yazılı izni olmadan görev yaptığı okullarda kendi adına veya üçüncü kişiler adına ücretli ya da ücretsiz ders, kurs veya etkinlik veremez.`]);
  A('GİZLİLİK VE FİKRÎ MÜLKİYET',[`EĞİTMEN; ${W}'in okul ve müşteri listesi, fiyat ve sözleşme koşulları, eğitmen ücretleri, müfredatı, eğitim materyalleri ve iş modeline ilişkin tüm bilgileri gizli tutar. Bu yükümlülük sözleşmenin sona ermesinden sonra 2 (iki) yıl devam eder.`,
    `${W}'e ait müfredat, ders planı ve eğitim materyalleri çoğaltılamaz, üçüncü kişilerle paylaşılamaz ve EĞİTMEN tarafından kendi adına kullanılamaz; bu materyaller üzerindeki haklar ${W}'e aittir.`]);
  A('MÜŞTERİ ÇEVRESİNE YÖNELMEME, AYARTMA VE DOLANMA YASAĞI',[
    `<b>Korunan Müşteri:</b> EĞİTMEN'in bu sözleşme kapsamında fiilen ders verdiği, ders vermek üzere görevlendirildiği veya ${W} adına tanıtım ya da teklif sunduğu okul, kurum ve kuruluşlardır. EK-1'de sayılan kurumlar Korunan Müşteri listesinin parçasıdır; görev yeri değiştikçe liste panel üzerinden güncellenir.`,
    `EĞİTMEN, sözleşme süresince ve sözleşmenin sona ermesinden itibaren <b>2 (iki) yıl</b> boyunca aşağıdakileri <b>yapamaz</b>:<br>(a) ${W} adına gittiği okul ve kurumlarla, ${W}'i devre dışı bırakarak kendi adına ya da başka bir kişi veya firma adına <b>doğrudan ya da arka planda anlaşma yapamaz</b>;<br>(b) bu okullara ${W}'in fiyatından <b>daha uygun ya da farklı bir teklif sunamaz</b>, sunulmasına aracılık edemez;<br>(c) bu okullarda ${W} dışında bir kişi veya firma adına ya da kendi adına <b>robotik, kodlama ve teknoloji eğitimi veremez, çalışamaz</b>;<br>(d) okul yönetimini ${W} ile çalışmayı bırakmaya veya sözleşmeyi yenilememeye yönlendiremez.`,
    `<b>Dolanma yasağı:</b> Bu yasaklar, EĞİTMEN'in eşi, birinci ve ikinci derece hısımları, ortağı, yöneticisi, çalışanı, danışmanı, temsilcisi veya alt yüklenicisi olduğu gerçek ve tüzel kişiler eliyle yapılan işlemleri de kapsar; EĞİTMEN yasağı bu kişiler aracılığıyla dolanamaz.`,
    `<b>Ayartma yasağı:</b> EĞİTMEN aynı süre içinde Korunan Müşterileri ${W} ile sözleşmesini feshetmeye veya yenilememeye yöneltemez; ${W}'in diğer eğitmenlerini ayrılmaya teşvik edemez.`,
    `<b>İş sırrı ve haksız rekabet:</b> Müşteri listesi, okul bağlantıları, fiyat yapısı, müfredat ve iş modeli 6102 sayılı Türk Ticaret Kanunu m.55/1-d anlamında iş sırrıdır; izinsiz kullanımı haksız rekabet teşkil eder.`,
    `Yasak; süre (2 yıl), yer (yalnızca Korunan Müşteriler) ve konu (robotik, kodlama ve teknoloji eğitimi) bakımından sınırlıdır; EĞİTMEN'in başka kurumlarda çalışmasını engellemez.`,
    `<b>Aykırılığın sonuçları:</b> Bu maddeye aykırılık hâlinde EĞİTMEN, ${W}'in bu nedenle uğradığı tüm zararı (kaybedilen okulun ${W}'e ödediği/ödeyeceği hizmet bedeli ve yoksun kalınan kazanç dahil) tazmin etmekle yükümlüdür. ${W}, zararın tazmini ile haksız rekabetten doğan talepleri için dava açma ve icra takibi başlatma hakkına sahiptir.`,
    `<b>Aykırılığa son verilmesi:</b> ${W}, zararın tazmini yanında, yasağa aykırı davranışa son verilmesini (aykırı çalışmanın durdurulmasını) mahkemeden talep etme hakkını açıkça saklı tutar${typeA?' (6098 sayılı TBK m.446/3)':''}.`,
    `<b>Bildirim:</b> EĞİTMEN, sözleşmenin sona ermesinden itibaren 2 yıl içinde bir Korunan Müşteriden doğrudan veya dolaylı iş teklifi alırsa bunu 7 gün içinde ${W}'e yazılı olarak bildirir.`]
    .concat(typeA?[`İşbu madde, İŞVEREN tarafından haklı bir sebep olmaksızın yapılan fesih ile EĞİTMEN'in İŞVEREN'e yüklenebilen bir nedenle haklı fesih yapması hâllerinde TBK m.447/2 uyarınca sona erer.`]:[]));
  A('KİŞİSEL VERİLER VE GÖRSELLER',[`EĞİTMEN'in kişisel verileri, işbu sözleşmeye ekli KVKK Aydınlatma Metni'nde açıklanan amaçlarla işlenir.`,
    `EĞİTMEN, öğrencilere ait kişisel verileri yalnızca eğitim amacıyla ve ${W}'in talimatı doğrultusunda işler; bu verileri üçüncü kişilerle paylaşamaz, kişisel cihazlarında saklayamaz.`,
    `Ders ortamında çekilen fotoğraf ve videolar yalnızca veli onayı ve ${W}'in izniyle kullanılabilir; EĞİTMEN bu görselleri kendi sosyal medya hesaplarında paylaşamaz.`]);
  A('FESİH',typeA?[`Taraflar, 4857 sayılı İş Kanunu'nun 17. maddesindeki bildirim sürelerine uyarak sözleşmeyi feshedebilir; Kanun'un 24. ve 25. maddelerindeki hâllerde sözleşme derhal feshedilebilir.`,
    `Zimmetli ekipmanın izinsiz çıkarılması, gizlilik ve müşteri çevresine yönelmeme maddelerine aykırılık, ${pay+1}. maddede sayılan bildirimsiz devamsızlık hâlleri ve öğrenci güvenliğini tehlikeye düşüren davranışlar İŞVEREN bakımından haklı fesih sebebidir.`]
    :[`Taraflardan her biri, en az 30 (otuz) gün önceden yazılı bildirimde bulunarak sözleşmeyi sona erdirebilir. Dönem ortasında ayrılmalarda EĞİTMEN, okulların ders düzeninin aksamaması için bildirim süresi boyunca derslerine devam eder.`,
    `Zimmetli ekipmanın izinsiz çıkarılması, gizlilik ve müşteri çevresine yönelmeme maddelerine aykırılık, ${pay+1}. maddede sayılan bildirimsiz devamsızlık hâlleri ve öğrenci güvenliğini tehlikeye düşüren davranışlar hâlinde TT ROBOTICS sözleşmeyi bildirim süresi beklemeksizin derhal sona erdirebilir.`,
    `Sözleşme sona erdiğinde EĞİTMEN zimmetindeki ekipmanı teslim eder; son ödeme, onaylı ders kayıtları üzerinden hesaplanarak yapılır.`]);
  A('TEBLİGAT VE ELEKTRONİK ONAY',[`Tarafların yukarıda yazılı adresleri tebligat adresidir; adres değişikliği 3 iş günü içinde bildirilmedikçe eski adrese yapılan tebligat geçerlidir. Ders programı, ders kaydı, aylık özet ve rutin yazışmalar bakımından TT Robotics paneli, bildirilen telefon numarası ve e-posta adresi geçerli iletişim kanalıdır.`,
    `EĞİTMEN'in sözleşmeyi kendi kişisel PIN'i ile panelde "Okudum, onaylıyorum" olarak işaretlemesi; onay tarihi, saati ve sözleşme sürümüyle birlikte kayıt altına alınır. Taraflar ayrıca sözleşmenin ıslak imzalı nüshasını imzalar; imzalı nüsha panele yüklenir veya ${W}'e teslim edilir.`]);
  A('UYUŞMAZLIKLAR',[typeA?`İşbu sözleşmeden doğan uyuşmazlıklarda 7036 sayılı Kanun uyarınca dava şartı olarak arabuluculuğa başvurulur; anlaşma sağlanamazsa ${esc(cfg.court)} İş Mahkemeleri ve İcra Daireleri yetkilidir.`:`İşbu sözleşmeden doğan uyuşmazlıklarda ${esc(cfg.court)} Mahkemeleri ve İcra Daireleri yetkilidir.`]);
  A('YÜRÜRLÜK VE EKLER',[`İşbu sözleşme ${n+1} madde ile EK-1 Ücret Çizelgesi ve EK-2 KVKK Aydınlatma Metni'nden oluşur; ekler sözleşmenin ayrılmaz parçasıdır.`,
    `Sözleşmenin herhangi bir hükmünün geçersiz sayılması diğer hükümleri etkilemez.`]);
  const ek1=`<h2 class="pb">EK-1 — ÜCRET ÇİZELGESİ (${fmtDMY(cfg.periodStart)} – ${fmtDMY(cfg.periodEnd)})</h2>
  <p>EĞİTMEN: <b>{{AD}}</b>. Aşağıdaki tutarlar yalnızca EĞİTMEN'e aittir ve gizlidir.</p>
  <table class="ek"><thead><tr><th>Okul / kurum</th><th>Gün</th><th>Ücret</th><th>Özel şartlar</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><b>${esc(r.school)}</b>${r.program?`<br><small>${esc(r.program)}</small>`:''}</td><td>${esc(r.days)}${r.lessons?`<br><small>${esc(r.lessons)}</small>`:''}</td><td>${r.pay}</td><td>${r.terms.length?r.terms.map(x=>`<div>• ${x}</div>`).join(''):'—'}</td></tr>`).join(''):'<tr><td colspan="4">Henüz görev yeri tanımlanmadı.</td></tr>'}</tbody></table>
  <p><small>Ödeme ${pay}. maddeye göre onaylı ders kayıtları üzerinden yapılır. Bu çizelge görev yeri veya ücret değiştikçe panel üzerinden güncellenir ve EĞİTMEN'in onayına sunulur.</small></p>`;
  const kvkk=`<h2 class="pb">EK-2 — KİŞİSEL VERİLERİN İŞLENMESİNE İLİŞKİN AYDINLATMA METNİ</h2>
  <p>6698 sayılı Kişisel Verilerin Korunması Kanunu ("KVKK") m.10 uyarınca, veri sorumlusu sıfatıyla <b>${esc(cfg.company)}</b> tarafından kişisel verileriniz aşağıda açıklanan kapsamda işlenmektedir.</p>
  <p><b>İşlenen veriler:</b> Kimlik (ad soyad, T.C. kimlik no), iletişim (telefon, e-posta, adres), finans (IBAN, ödeme kayıtları), mesleki deneyim ve müsaitlik bilgileri, ders programı, ders kayıtları ve panel kullanım kayıtları (giriş ve onay zamanları).</p>
  <p><b>İşleme amaçları:</b> Sözleşmenin kurulması ve ifası; ders programlarının planlanması; ders kayıtlarının tutulması ve ücretlerin hesaplanıp ödenmesi; zimmetli ekipmanın takibi; okul ve kurumlarla koordinasyon; yasal yükümlülüklerin yerine getirilmesi; hukuki uyuşmazlıklarda delil olarak kullanılması.</p>
  <p><b>Hukuki sebepler:</b> KVKK m.5/2-c (sözleşmenin kurulması veya ifası), m.5/2-ç (hukuki yükümlülük), m.5/2-e (bir hakkın tesisi, kullanılması veya korunması) ve m.5/2-f (meşru menfaat).</p>
  <p><b>Aktarım:</b> Verileriniz, yukarıdaki amaçlarla sınırlı olarak bankalar, mali müşavir, yetkili kamu kurum ve kuruluşları ve görev yaptığınız okul ve kurumlarla (yalnızca ad soyad ve ders programı) paylaşılabilir. Panel verileri, hizmet sağlayıcı Google'ın bulut altyapısında (yurt dışındaki sunucularda) saklanmaktadır.</p>
  <p><b>Toplama yöntemi:</b> Verileriniz, TT Robotics paneli, müsaitlik formu, sözleşme ve yazışmalar aracılığıyla elektronik ve fiziki ortamda toplanır.</p>
  <p><b>Haklarınız:</b> KVKK m.11 uyarınca; verilerinizin işlenip işlenmediğini öğrenme, bilgi talep etme, işleme amacını öğrenme, aktarıldığı üçüncü kişileri bilme, eksik veya yanlış işlenmişse düzeltilmesini, KVKK m.7 çerçevesinde silinmesini veya yok edilmesini isteme, itiraz etme ve zararın giderilmesini talep etme haklarına sahipsiniz. Başvurularınızı ${esc(cfg.contact||cfg.company)} adresine yazılı olarak iletebilirsiniz.</p>
  <h3>Açık rıza (isteğe bağlı)</h3><p>Kişisel verilerimin, TT Robotics panelinin barındırıldığı Google bulut altyapısı nedeniyle yurt dışındaki sunuculara aktarılmasına ve ders ortamında çekilen ve beni gösteren fotoğraf/videoların TT Robotics'in tanıtım kanallarında kullanılmasına açık rıza veriyorum. Bu rızayı dilediğim zaman geri alabilirim; rıza vermemem sözleşmenin kurulmasını etkilemez.</p>`;
  const title=typeA?'KISMİ SÜRELİ İŞ SÖZLEŞMESİ':'EĞİTİM HİZMETİ SÖZLEŞMESİ';
  const sign=`<table class="sig"><tr><td><b>${W}</b><br>${esc(cfg.company)}<br><br>Tarih: …/…/20…<br><br>İmza / Kaşe:</td><td><b>EĞİTMEN</b><br>{{AD}}<br><br>Tarih: …/…/20…<br><br>İmza:</td></tr></table>`;
  return `<div class="agr-doc"><h1>${title}</h1><p class="sub">Robotik ve kodlama eğitmeni · ${fmtDMY(cfg.periodStart)} – ${fmtDMY(cfg.periodEnd)}</p>${art.join('')}${sign}${ek1}${sign}${kvkk}{{ONAY}}</div>`;
}
function agrFill(a){
  const p=agrPersonal(Object.assign({name:(teacherById(a.teacherId)||{}).name||a.name},a.personal||{}));
  const onay=a.acceptedAt?`<div class="agr-stamp">Elektronik onay: ${esc(p.name)} · ${new Date(a.acceptedAt).toLocaleString('tr-TR')} · sözleşme sürümü ${esc(a.acceptedVersion)} · doğrulama kodu ${esc(a.acceptedHash||a.hash)}${a.consentAt?' · açık rıza verildi':' · açık rıza verilmedi'}</div>`:'';
  const sg=state.sigAssets||{};const ttsig=(sg.sig||sg.stamp)?`<div class="ttsig">${sg.stamp?`<img class="stamp" src="${esc(sg.stamp)}" alt="Kaşe">`:''}${sg.sig?`<img class="sig" src="${esc(sg.sig)}" alt="İmza">`:''}</div>`:'';
  return String(a.body||'').replace(/İmza \/ Kaşe:/g,'İmza / Kaşe:'+ttsig).replace(/{{AD}}/g,p.name).replace(/{{TC}}/g,p.tc).replace(/{{ADRES}}/g,p.address).replace(/{{IBAN}}/g,p.iban).replace(/{{EPOSTA}}/g,p.email).replace(/{{TEL}}/g,p.phone).replace('{{ONAY}}',onay);
}
const AGR_CSS=`.agr-doc{font:14px/1.55 Georgia,'Times New Roman',serif;color:#111}.agr-doc h1{font-size:20px;text-align:center;margin:0 0 4px}.agr-doc .sub{text-align:center;color:#555;margin:0 0 18px}.agr-doc h2{font-size:16px;margin:26px 0 8px}.agr-doc h3{font-size:14px;margin:18px 0 6px}.agr-doc p{margin:0 0 8px;text-align:justify}.agr-doc table.ek{width:100%;border-collapse:collapse;font-size:12.5px}.agr-doc table.ek th,.agr-doc table.ek td{border:1px solid #999;padding:6px;vertical-align:top;text-align:left}.agr-doc table.sig{width:100%;margin:22px 0}.agr-doc table.sig td{width:50%;vertical-align:top;padding:8px}.agr-doc .ttsig{position:relative;height:120px;margin-top:4px}.agr-doc .ttsig .stamp{position:absolute;left:0;top:0;height:118px;opacity:.95}.agr-doc .ttsig .sig{position:absolute;left:142px;top:34px;height:48px}.agr-doc .agr-stamp{margin-top:18px;padding:8px;border:1px dashed #555;font-size:12px}`;
function agrStatus(a){
  if(!a||!a.sentAt)return ['', 'Gönderilmedi'];
  if(a.signedFile||a.signedReceivedAt)return ['ok','İmzalı belge alındı'];
  if(a.acceptedAt&&a.acceptedVersion===a.version)return ['ok','Onaylandı · imzalı belge bekleniyor'];
  if(a.acceptedAt)return ['warn','Yeni sürüm onay bekliyor'];
  return ['warn','Öğretmen onayı bekleniyor'];

async function agrUpload(tid,file){
  if(!state.remote||!state.db.upload){toast('Dosya yükleme yalnızca canlı sitede çalışır.','bad');return;}
  if(file.size>15*1024*1024){toast('Dosya çok büyük (en fazla 15 MB).','bad');return;}
  toast('Yükleniyor…');
  let blob=file,mime=file.type||'application/octet-stream',name=file.name||'imzali_sozlesme';
  if(/^image\//.test(mime)&&file.size>900*1024){blob=await new Promise(res=>{const img=new Image();img.onload=()=>{const k=Math.min(1,2000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b||file),'image/jpeg',0.85);};img.onerror=()=>res(file);img.src=URL.createObjectURL(file);});if(blob!==file){mime='image/jpeg';name=name.replace(/\.\w+$/,'')+'.jpg';}}
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob);});
  const err=await attempt(()=>state.db.upload({col:'agreements',id:tid,name,mime,b64}));
  if(err)toast(err,'bad');else toast('İmzalı sözleşme yüklendi. Teşekkürler!','ok');
}

function ttInfo(l){const a=state.assignments.find(x=>x.id===l.assignmentId)||{};const cls=aClasses(a);

function ttCard(l){IDX.lessons[l.id]=l;const st=ttState(l);const i=ttInfo(l);const today=l.date===todayISO();
  const tag=[l.substituteFor?`${tName(l.substituteFor)} yerine girdi`:l.makeupFor?`Telafi · ${fmtDate(l.makeupDate)} dersi yerine`:l.extra?'Ek ders':'',l.replacedBy?`Yerine ${tName(l.replacedBy)} girdi`:'',l.makeupBy?(l.makeupOn?`Telafi edildi → ${fmtDate(l.makeupOn)}`:'Telafi edildi'):''].filter(Boolean).join(' · ');

function ttTable(ls,ws,o){o=o||{};

    if(st!=='miss')r.total+=i.n;else r.miss+=Number(l.plannedHours||l.hours)||0;if(st==='done'){r.done+=i.n;done+=i.n;mins+=i.n*40;}else if(st==='trial'){r.trial+=i.n;trial+=i.n;}else if(st==='miss')miss+=Number(l.plannedHours||l.hours)||0;else if(st==='wait')wait+=i.n;else plan+=i.n;}

  const sum=ls.length?`<div class="ttsums"><div class="ttsum lead"><h3>Bu hafta toplam</h3><div class="big">${fmtNum(done)}<small> / ${fmtNum(total)} ders</small></div>

    <div class="muted small">${fmtNum(done)} girildi · ${fmtNum(wait)} işaretlenmedi · ${fmtNum(miss)} yapılmadı${trial?` · ${fmtNum(trial)} deneme`:''} · ${fmtNum(plan)} planlı</div>

function ttMenu(btnEl){const l=IDX.lessons[btnEl.dataset.tt];if(!l)return;const old=document.getElementById('ttmenu');if(old)old.remove();
  const st=ttState(l);const admin=isAdmin();const i=ttInfo(l);
  const locked=!admin&&monthLocked(l.teacherId,monthKeyOf(l.date));

  else{
    const db=isDayBased(l.schoolId);

    else if(st!=='done')items+=b('done',`✓ Derse girdim (${fmtNum(i.n)} ders)`);
    if(st==='done'&&db&&!locked)items+=b(dayTypeOf(l)==='tam'?'half':'full',dayTypeOf(l)==='tam'?'◐ Yarım güne çevir…':'● Tam güne çevir…');
    items+=b('edit',st==='wait'?'✎ Derse girdim — saati / deneme dersini seç…':'✎ Düzenle…');
    if(st!=='miss')items+=b('miss','✕ Yapılmadı');
    if(st!=='wait'&&!l.virtual)items+=b('undo','↺ Yanlışlıkla işaretledim, geri al');

  m.style.left=Math.max(8,Math.min(r.left,innerWidth-mw-8))+'px';m.style.top=(r.bottom+mh+8>innerHeight?Math.max(8,r.top-mh-6):r.bottom+6)+'px';
  const f=m.querySelector('button');if(f)f.focus();}
async function ttAct(act,id){const l=IDX.lessons[id];const m=document.getElementById('ttmenu');if(m)m.remove();if(!l)return;
  if(act==='edit')return openDone(l);
  if(act==='half')return openDone(l,{dayType:'yarim'});
  if(act==='full')return openDone(l,{dayType:'tam'});
  if(act==='miss')return openCancel(l);
  if(act==='makeup')return openMakeup(l.id);
  if(act==='verify')return ACT.verifyLesson({id:l.id});
  if(act==='undo'){if(l.makeupBy&&!l.extra)return toast('Bu dersin telafisi girilmiş. Önce telafi kaydını silin.','bad');
    if(l.extra)return ACT.resetLesson({id:l.id});
    const err=await attempt(()=>delDoc('lessons',l.id));if(err)return toast(err,'bad');PAYMEMO={};return toast('Kayıt geri alındı; ders yeniden işaretlenmemiş durumda.','ok');}
  if(act==='done'){const admin=isAdmin();if(l.makeupBy)return toast('Bu dersin telafisi girilmiş; önce telafiyi silin.','bad');
    const hours=Number(l.plannedHours||l.hours)||1;
    const rec=Object.assign(cleanLesson(l),{status:'done',hours,trial:false,dayType:isDayBased(l.schoolId)?'tam':null,rate:admin?rateFor(l):null,confirmedAt:nowStamp(),confirmedBy:actorLabel(),reason:null,verified:admin,verifiedBy:admin?actorLabel():null,verifiedAt:admin?nowStamp():null});
    if(rec.extra&&rec.approved==null)rec.approved=admin;if(!rec.extra)rec.approved=true;
    const err=await attempt(()=>putDoc('lessons',rec));if(err)return toast(err,'bad');PAYMEMO={};toast(`Kaydedildi: ${rec.dayType?DAYTYPE_LBL[rec.dayType]+' · ':''}${fmtNum(hours)} ders.`,'ok');}
}
document.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('.ttc[data-tt]');if(c){e.preventDefault();e.stopPropagation();ttMenu(c);return;}

  const m=document.getElementById('ttmenu');if(m&&!m.contains(e.target))m.remove();},true);

/* ---- gün bazlı okullar: tam gün / yarım gün ---- */
const isDayBased=sid=>{const s=schoolById(sid)||((state.raw&&state.raw.schools)||[]).find(x=>x.id===sid)||{};return !!s.dayBased||state.assignments.some(a=>a.schoolId===sid&&a.dayBased);};
const fullDayLessons=l=>{const c=(state.contracts||[]).find(x=>(x.schoolId||x.id)===l.schoolId);const d=c&&(c.teacherDeals||[]).find(x=>x.teacherId===l.teacherId&&x.model==='gunluk');return Number(d&&d.approxLessons)||Number(l.plannedHours)||7;};
const dayTypeOf=l=>!isDayBased(l.schoolId)?'tam':l.dayType||(Number(l.hours||l.plannedHours)>=Math.ceil(fullDayLessons(l)*0.6)?'tam':'yarim');
const DAYTYPE_LBL={tam:'Tam gün',yarim:'Yarım gün'};
const dayFactor=(l,c,d)=>dayTypeOf(l)==='yarim'?((d&&Number(d.halfFactor))||(c&&Number(c.halfFactor))||0.5):1;

function ttCount(ls){const per={};let done=0,plan=0,miss=0,wait=0,trial=0;
  const dseen={};for(const l of ls){const st=ttState(l);const i=ttInfo(l);const r=per[l.schoolId]||(per[l.schoolId]={done:0,total:0,miss:0,trial:0,wait:0,full:0,half:0});
    if(st==='done'&&isDayBased(l.schoolId)){const k=l.schoolId+'|'+l.teacherId+'|'+l.date;if(!dseen[k]){dseen[k]=1;if(dayTypeOf(l)==='tam')r.full++;else r.half++;}}
    if(st!=='miss')r.total+=i.n;if(st==='done'){r.done+=i.n;done+=i.n;}else if(st==='trial'){r.trial+=i.n;trial+=i.n;}else if(st==='miss'){const m=Number(l.plannedHours||l.hours)||0;r.miss+=m;miss+=m;}else if(st==='wait'){r.wait+=i.n;wait+=i.n;}else plan+=i.n;}
  return {per,done,plan,miss,wait,trial,total:done+trial+wait+plan};}
const ttDur=n=>{const m=n*40;return `${Math.floor(m/60)} sa${m%60?' '+(m%60)+' dk':''}`;};
function ttShort(id){const n=sName(id);const w=n.replace(/(İlkokulu|Ortaokulu|Anaokulu|Eğitim Kurumları|Kurumları|Belediyesi|Kreşleri|Okulları|Koleji|Lisesi)/g,'').replace(/\s+/g,' ').trim();return w.length>22?w.slice(0,21)+'…':w||n;}
function ttMini(l){IDX.lessons[l.id]=l;const st=ttState(l);const i=ttInfo(l);const tag=l.substituteFor?'↔ ':l.makeupFor?'↺ ':l.extra?'+ ':'';

function tMonthView(){

    <div class="two">${field('Başlangıç saati',input('start',{type:'time',value:a.start||''}))}${field('Bitiş saati',input('end',{type:'time',value:a.end||''}))}</div>
    <div class="two">${field('Ders saati (40 dk = 1 ders, ücret hesabına esas)',input('hours',{type:'number',value:a.hours,min:0.5,max:12,step:0.5,req:true}))}${field('Öğretmene saat ücreti (TL, isteğe bağlı)',input('rate',{type:'number',value:a.rate||'',min:0,step:1,ph:'boşsa okulda tanımlı ücret'}))}</div>
    <div class="two">${field('Başlangıç tarihi',input('validFrom',{type:'date',value:a.validFrom||''}))}${field('Bitiş tarihi (isteğe bağlı)',input('validTo',{type:'date',value:a.validTo||''}))}</div>
    ${field('Öğrenciler (her satıra bir öğrenci, isteğe bağlı)',textarea('students',(a.students||[]).join('\n'),'Ali Mert Çelik\nMete Esgar'))}
    ${field('Not',input('note',{value:a.note||'',ph:'Sınıf, şube, yardımcı eğitmen…'}))}`,
    onSubmit:async f=>{if(!f.teacherId||!f.schoolId)return 'Öğretmen ve okul seçin.';const hours=Number(f.hours);if(!(hours>=0.5&&hours<=12))return 'Süre 0,5 ile 12 saat arasında olmalı.';if(f.validTo&&f.validFrom&&f.validTo<f.validFrom)return 'Bitiş tarihi başlangıçtan önce olamaz.';
      const rec=Object.assign({},a,{id:a.id||uid(),teacherId:f.teacherId,schoolId:f.schoolId,weekday:Number(f.weekday),start:f.start||'',end:f.end||'',program:f.program||'',students:String(f.students||'').split('\n').map(x=>x.trim()).filter(Boolean),hours,rate:f.rate?Number(f.rate):null,validFrom:f.validFrom||null,validTo:f.validTo||null,note:f.note,active:true,createdAt:a.createdAt||nowStamp()});
      const err=await attempt(()=>putDoc('assignments',rec));if(err)return err;toast(isNew?'Program satırı eklendi.':'Program güncellendi.','ok');}});
}
function openTeacher(t,self){
  const isNew=!t;t=t||{active:true};
  openModal({title:self?'Bilgilerimi düzenle':isNew?'Öğretmen ekle':'Öğretmeni düzenle',
    body:field('Ad soyad',input('name',{value:t.name||'',req:true}))+`<div class="two">${field('Telefon',input('phone',{value:t.phone||'',type:'tel'}))}${field('E-posta',input('email',{value:t.email||'',type:'email'}))}</div><div class="two">${field(self?'Giriş PIN':'Giriş PIN (4-6 rakam)',input('pin',{value:t.pin||String(Math.floor(1000+Math.random()*9000)),req:true,attrs:'inputmode="numeric" minlength="4" maxlength="6"'}))}${field('İkamet ilçesi',input('district',{value:t.district||'',ph:'Ümraniye'}))}</div><div class="two">${field('Semt / mahalle',input('semt',{value:t.semt||''}))}${field('Ulaşabileceği diğer ilçeler',input('otherDistricts',{value:t.otherDistricts||'',ph:'Üsküdar, Kadıköy…'}))}</div>`+(self?'':field('Yönetici notu',input('note',{value:t.note||'',ph:'Branş, başlangıç tarihi…'}))),
    onSubmit:async f=>{if(!f.name)return 'Ad soyad girin.';if(!/^\d{4,6}$/.test(f.pin))return 'PIN 4-6 rakamdan oluşmalı.';
      const rec=Object.assign({},t,{id:t.id||uid(),name:f.name,phone:f.phone,email:f.email,pin:f.pin,district:f.district,semt:f.semt,otherDistricts:f.otherDistricts,active:t.active!==false,createdAt:t.createdAt||nowStamp()});
      if(!self)rec.note=f.note;
      if(isNew&&isScoped())rec.schoolIds=state.session.scope.slice();
      const err=await attempt(()=>putDoc('teachers',rec));if(err)return err;toast(self?'Bilgileriniz güncellendi.':isNew?'Öğretmen eklendi.':'Öğretmen güncellendi.','ok');}});
}
function openCandidate(c){
  const isNew=!c;c=c||{status:'aday',days:[]};
  const days=WEEKDAYS6.map(wd=>`<label class="chk"><input type="checkbox" name="d${wd}" ${(c.days||[]).includes(wd)?'checked':''}>${DAYS_S[wd-1]}</label>`).join('');
  openModal({title:isNew?'Arşive öğretmen ekle':'Arşiv kaydını düzenle',wide:true,
    body:`<div class="two">${field('Ad soyad',input('name',{value:c.name||'',req:true}))}${field('Durum',select('status',CAND_STATUS.map(x=>({v:x[0],l:x[1]})),c.status||'aday'))}</div>
    <div class="two">${field('Telefon',input('phone',{value:c.phone||'',type:'tel'}))}${field('E-posta',input('email',{value:c.email||'',type:'email'}))}</div>
    <div class="two">${field('İkamet ilçesi',input('district',{value:c.district||'',ph:'Üsküdar'}))}${field('Semt / mahalle',input('semt',{value:c.semt||''}))}</div>
    ${field('Ulaşabileceği diğer ilçeler',input('otherDistricts',{value:c.otherDistricts||'',ph:'Kadıköy, Ataşehir…'}))}
    ${field('Branş / uzmanlık (virgülle ayırın)',input('tags',{value:candTags(c).join(', '),list:'candtags',ph:'Robotik kodlama, Drone, Okul öncesi…'}))}<datalist id="candtags">${CAND_TAGS.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
    <div class="two">${field('Mezuniyet / eğitim',input('education',{value:c.education||'',ph:'BÖTE, 2021'}))}${field('Deneyim',input('experience',{value:c.experience||'',ph:'3 yıl robotik, Teknofest danışmanlığı'}))}</div>
    <div class="fld"><span>Müsait günler</span><div class="pill-row">${days}</div></div>
    <div class="two">${field('CV bağlantısı (Drive vb.)',input('cvUrl',{value:c.cvUrl||'',type:'url',ph:'https://drive.google.com/…'}))}${field('Kaynak',input('source',{value:c.source||'',ph:'İlan, referans, eğitmen eğitimi…'}))}</div>
    ${field('Notlar',textarea('notes',c.notes||'','Görüşme izlenimi, ücret beklentisi, uygun okul türü…'))}`,
    onSubmit:async f=>{if(!f.name)return 'Ad soyad girin.';if(f.cvUrl&&!safeUrl(f.cvUrl))return 'CV bağlantısı http:// veya https:// ile başlamalı.';
      const tags=String(f.tags||'').split(',').map(s=>s.trim()).filter(Boolean);const days=WEEKDAYS6.filter(wd=>f['d'+wd]);
      const rec=Object.assign({},c,{id:c.id||uid(),name:f.name,status:f.status||'aday',phone:f.phone,email:f.email,district:f.district,semt:f.semt,otherDistricts:f.otherDistricts,tags,education:f.education,experience:f.experience,days,cvUrl:f.cvUrl,source:f.source,notes:f.notes,createdAt:c.createdAt||nowStamp()});
      const err=await attempt(()=>putDoc('candidates',rec));if(err)return err;toast(isNew?'Arşive eklendi.':'Kayıt güncellendi.','ok');}});
}
function openAvail(t){
  const body=WEEKDAYS6.map(wd=>{const a=dayAvail(t,wd);if(a.kind==='okul')return field(DAYS[wd-1],`<div class="pill-row">${a.schools.map(s=>chip('accent',esc(s))).join(' ')}</div>`,'Haftalık programdan gelir');const v=(t.avail||{})[String(wd)]||'';return field(DAYS[wd-1],select('d'+wd,[{v:'',l:'Belirtilmedi'},{v:'bos',l:'Boş · ders verebilir'},{v:'dolu',l:'Dolu'}],v));}).join('');
  openModal({title:isAdmin()?`${esc(t.name)} · müsaitlik`:'Müsaitliğimi güncelle',body:`<div class="two">${body}</div>`+field('Not',input('availNote',{value:t.availNote||'',ph:'Örn. Cuma 10:00 sonrası boş'})),
    onSubmit:async f=>{const avail={};WEEKDAYS6.forEach(wd=>{const v=f['d'+wd];if(v==='bos'||v==='dolu')avail[String(wd)]=v;});
      const err=await attempt(()=>putDoc('teachers',Object.assign({},t,{avail,availNote:f.availNote,availUpdatedAt:nowStamp(),formStatus:'Tamam'})));if(err)return err;toast('Müsaitlik güncellendi.','ok');}});
}
function openSchool(s){
  const isNew=!s;s=s||{active:true,kind:'okul'};
  openModal({title:isNew?'Kurum ekle':'Kurumu düzenle',
    body:`<div class="two">${field('Kurum adı',input('name',{value:s.name||'',req:true}))}${field('Tür',select('kind',SCHOOL_KINDS.map(x=>({v:x[0],l:x[1]})),s.kind||'okul'))}</div><div class="two">${field('İlçe / semt',input('district',{value:s.district||''}))}${field('Öğretmene ödenen ders saati ücreti (TL)',input('rate',{type:'number',value:s.rate||'',min:0,step:1,ph:'isteğe bağlı'}),'Öğretmen maliyeti ve aylık rapor bu ücretle hesaplanır. Okulun ödediği ücret Finans → Sözleşme\'ye girilir.')}</div><div class="two">${field('Yetkili kişi',input('contact',{value:s.contact||''}))}${field('Telefon',input('phone',{value:s.phone||'',type:'tel'}))}</div>`+field('Bağlı olduğu iş ortağı / grup',input('group',{value:s.group||'',ph:'Boş: TT Robotics doğrudan · ör. BSA Akademi'}),'BSA Akademi üzerinden gelen okullar bu adla gruplanır.')+field('Adres',input('address',{value:s.address||'',ph:'Mahalle, cadde, no'}))+field('Not',input('note',{value:s.note||'',ph:'Dolap, giriş, özel durum…'}))+`<label class="small" style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" name="dayBased" value="1" ${s.dayBased?'checked':''}> <b>Gün üzerinden çalışılıyor</b> — öğretmen dersleri “Tam gün / Yarım gün” olarak işaretler</label>`,
    onSubmit:async f=>{if(!f.name)return 'Kurum adı girin.';const rec=Object.assign({},s,{id:s.id||uid(),name:f.name,kind:f.kind||'okul',district:f.district,rate:f.rate?Number(f.rate):null,group:(f.group||'').trim(),contact:f.contact,phone:f.phone,address:f.address,note:f.note,dayBased:!!f.dayBased,active:s.active!==false,createdAt:s.createdAt||nowStamp()});const err=await attempt(async()=>{await putDoc('schools',rec);const ch=((state.raw&&state.raw.assignments)||state.assignments).filter(a=>a.schoolId===rec.id&&!!a.dayBased!==rec.dayBased).map(a=>Object.assign({},a,{dayBased:rec.dayBased}));if(ch.length)await putMany('assignments',ch);});if(err)return err;toast(isNew?'Kurum eklendi.':'Kurum güncellendi.','ok');}});
}
function locFields(locType,locId){
  return `${field('Nerede / kimde',select('locType',[{v:'depo',l:'Depo (TT Robotics)'},{v:'okul',l:'Okulda'},{v:'ogretmen',l:'Öğretmende (zimmet)'}],locType||'depo',{attrs:'data-mchange="loctype"'}))}
  <div id="loc-school" ${locType==='okul'?'':'hidden'}>${field('Okul',select('schoolId',activeSchools().map(s=>({v:s.id,l:s.name})),locType==='okul'?locId:'',{ph:'Seçin'}))}</div>
  <div id="loc-teacher" ${locType==='ogretmen'?'':'hidden'}>${field('Öğretmen',select('teacherId',activeTeachers().map(t=>({v:t.id,l:t.name})),locType==='ogretmen'?locId:'',{ph:'Seçin'}))}</div>`;
}
function resolveLoc(f){const type=f.locType||'depo';const id=type==='okul'?f.schoolId:type==='ogretmen'?f.teacherId:'';if(type!=='depo'&&!id)return null;return {locType:type,locId:id||''};}
function openSet(s,pre){
  const isNew=!s;s=s||Object.assign({code:nextSetCode(),qty:1,status:'aktif',locType:'depo'},pre||{});
  openModal({title:isNew?'Set ekle':'Seti düzenle',
    body:`<div class="two">${field('Kod',input('code',{value:s.code||'',req:true}))}${field('Adet',input('qty',{type:'number',value:s.qty||1,min:1,req:true}))}</div>`+field('Set adı',`<div class="setsug-wrap">${input('setName',{value:s.name||'',req:true,ph:'LEGO SPIKE Prime 45678…',attrs:'autocomplete="off" autocorrect="off" spellcheck="false" data-setsug="1"'})}<div class="setsug" id="setsug" hidden></div></div>`)+`<div class="two">${field('Kategori',input('category',{value:s.category||'',list:'setcats'}))+'<datalist id="setcats">'+SET_CATS.map(c=>`<option value="${esc(c)}">`).join('')+'</datalist>'}${field('Durum',select('status',SET_STATUS.map(x=>({v:x[0],l:x[1]})),s.status||'aktif'))}</div>`+locFields(s.locType,s.locId)+field('Not',input('note',{value:s.note||'',ph:'Seri no, eksik parça, pil durumu…'})),
    onSubmit:async f=>{f.name=String(f.setName||'').trim();if(!f.code||!f.name)return 'Kod ve set adı girin.';const loc=resolveLoc(f);if(!loc)return 'Okul veya öğretmen seçin.';
      const hist=(s.history||[]).slice();const to=locLabel(loc.locType,loc.locId);const from=s.id?locLabel(s.locType,s.locId):'';
      if(isNew)hist.push({at:nowStamp(),to,by:actorLabel(),note:'Kayıt oluşturuldu'});else if(loc.locType!==s.locType||loc.locId!==s.locId)hist.push({at:nowStamp(),from,to,by:actorLabel(),note:'Düzenleme ile taşındı'});
      const rec=Object.assign({},s,{id:s.id||uid(),catPending:false,code:f.code,name:f.name,category:f.category,qty:Number(f.qty)||1,status:f.status,note:f.note},loc,{history:hist.slice(-50),createdAt:s.createdAt||nowStamp()});
      const err=await attempt(()=>putDoc('sets',rec));if(err)return err;toast(isNew?'Set eklendi.':'Set güncellendi.','ok');}});
}
function openMove(s){
  const admin=isAdmin();const me=myTeacherId();
  let def=s.locType||'depo';if(!admin){def=s.locType==='ogretmen'&&s.locId===me?'okul':'ogretmen';}
  const body=admin?locFields(def,s.locId):`${field('Yeni yeri',select('locType',[{v:'ogretmen',l:'Üzerime aldım (zimmet)'},{v:'okul',l:'Okula bıraktım'},{v:'depo',l:'Depoya teslim ettim'}],def,{attrs:'data-mchange="loctype"'}))}<div id="loc-school" ${def==='okul'?'':'hidden'}>${field('Okul',select('schoolId',schoolOptions(me),def==='okul'?s.locId:'',{ph:'Seçin'}))}</div><div id="loc-teacher" hidden><input type="hidden" name="teacherId" value="${esc(me)}"></div>`;
  openModal({title:'Seti taşı',meta:`${esc(s.code||'')} ${esc(s.name)} · şu an: ${esc(locLabel(s.locType,s.locId))}`,
    body:body+field('Not',input('note',{ph:'Dolap, teslim alan kişi, eksik parça…'})),submit:'Kaydet',
    onSubmit:async f=>{if(!admin&&f.locType==='ogretmen')f.teacherId=me;const loc=resolveLoc(f);if(!loc)return 'Okul veya öğretmen seçin.';if(loc.locType===s.locType&&loc.locId===s.locId)return 'Set zaten burada.';
      const hist=(s.history||[]).concat([{at:nowStamp(),from:locLabel(s.locType,s.locId),to:locLabel(loc.locType,loc.locId),by:actorLabel(),note:f.note}]).slice(-50);
      const err=await attempt(()=>putDoc('sets',Object.assign({},s,loc,{history:hist})));if(err)return err;toast('Set hareketi kaydedildi.','ok');}});
}

boot();
})();
</script>
